<style>
:root{--ink:#111;--yel:#FFD60A;--pink:#FF4D8D;--blue:#2D6BFF;--gray:#E4E4E4;
/* 우표 그림자: drop-shadow(가로 세로 번짐 색) 두 겹. 앞=붙어 있는 얇은 그림자, 뒤=살짝 퍼지는 그림자 */
--shadow:drop-shadow(1px 1px 1px rgba(90,60,0,.22)) drop-shadow(2px 2px 2px rgba(90,60,0,.2))}
*{box-sizing:border-box}
html{background-color:#FFF2A8;background-image:linear-gradient(#F3E58F 1px,transparent 1px),linear-gradient(90deg,#F3E58F 1px,transparent 1px);background-size:22px 22px;min-height:100%}
html,body{margin:0;color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:16px;line-height:1.3}
body{min-width:240px;max-width:640px;margin:0 auto;padding:12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:2px solid var(--ink);border-radius:6px;padding:7px;background:#fff;min-width:0;width:100%}
input:disabled,select:disabled,textarea:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
dialog.view input:not([type=checkbox]),dialog.view select,dialog.view textarea{border-color:transparent;background:transparent;padding:3px 0;appearance:none;-webkit-appearance:none;resize:none}
dialog.view textarea{min-height:0;field-sizing:content}
dialog.view input[type=date]::-webkit-calendar-picker-indicator{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2>div{min-width:0}
.ph.t3{font-size:16px;line-height:1.1}
#busy{width:auto;min-width:0;padding:16px 24px;font-weight:700}
#busy::backdrop{background:rgba(0,0,0,.35)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--gray);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
textarea{min-height:70px;max-height:200px;resize:vertical}
button{cursor:pointer;border:2px solid var(--ink);border-radius:6px;background:var(--yel);padding:7px 12px;font-weight:700}
button.plain{background:#fff}button.red{background:var(--pink)}
.hide{display:none!important}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;padding:10px 2px}
.tabs button.on{background:var(--blue);color:#fff}
.todo{display:flex;gap:10px;align-items:center;padding:2px 0;line-height:1.2;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.todo input{width:18px;height:18px;flex:none;accent-color:var(--blue)}
.todo .t{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo.done .t{text-decoration:line-through;color:#888}
.dt{font-size:13px;flex:0 1 auto;min-width:0;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#555}.todo.soon .t,.todo.soon .dt{color:#E5252A}
.hint{font-size:12px;color:#888;margin:8px 0}
.empty{color:#888;padding:12px 0}
#addf{position:sticky;bottom:0;margin-top:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:#FFF2A8;border-top:2px solid var(--ink)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-weight:700;font-size:13px}
.cell{min-height:88px;max-height:170px;overflow-y:auto;border:2px solid var(--ink);border-radius:6px;padding:3px;cursor:pointer}
.cell.today{background:#FFF6B8;border-width:3px}.cell.blank{border:0;cursor:default}
.dn{font-size:12px;font-weight:700}
.st{margin-top:3px;padding:2px 5px;min-height:20px;font-size:12px;line-height:16px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done{opacity:.45;text-decoration:line-through}
.dayrow{display:flex;gap:12px;padding:8px 0}
.dl{width:48px;flex:none;font-weight:700}.dl small{font-weight:400;color:#666}
.stamps{display:flex;flex-wrap:wrap;gap:8px}
.stamp,.pv{width:60px;height:72px;padding:0;background:var(--yel);cursor:pointer;flex:none;clip-path:var(--stamp)}
.sw{filter:var(--shadow);flex:none}
.pv{cursor:default}
.ph{width:100%;height:100%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.1}
.mr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0}
.mr.sub{margin-left:22px}.mr .t{flex:1;min-width:80px;word-break:break-word}
.mr button{padding:3px 8px;font-size:13px}
.thm{width:26px;height:26px;border-radius:5px;border:2px solid var(--ink);flex:none}
h3{margin:18px 0 6px;font-size:15px}
dialog{background:#fff;color:var(--ink);width:min(92vw,420px);min-width:240px;max-height:90vh;overflow:auto;border:3px solid var(--ink);border-radius:10px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:13px;font-weight:700;margin:9px 0 3px}
dialog.view .eo,dialog:not(.view) .vo{display:none!important}
.btns{display:grid;gap:6px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px}
</style>

<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
if(!window.Media)window.Media={init(){},url:()=>'',img:()=>'',newId:()=>crypto.randomUUID(),folder:{supported:false,name:async()=>''},process:async()=>{throw new Error('media.js could not be loaded')},upload:async()=>{throw new Error('media.js could not be loaded')},save:async()=>{throw new Error('media.js could not be loaded')}};
Media.init({worker:MEDIA_URL,getToken:async()=>(await sb.auth.getSession()).data.session?.access_token});
/* 독서·영상 분류는 코드에 고정: 삭제 불가, 이 분류의 일기는 독서앱(bkbk)·영화앱(mvmv) 행을 연결해서 표지/포스터를 가져올 수 있어요 */
const CAT_BOOK='eed2cf8c-8db6-42ba-b67f-cb18d51af4f0',CAT_MOVIE='89253f70-a97f-4747-b304-061a942866ed',LOCKED=new Set([CAT_BOOK,CAT_MOVIE]);
const $=id=>document.getElementById(id);
function stampPath(W=60,H=72,k=5,d=3,mx=7,my=9,ra=1.45,rr=.7){ // k=모서리 블록, d=톱니 깊이, mx/my=가로/세로 톱니 수, ra=톱니:홈 폭 비율, rr=모서리 둥글기
  const N=(L,m)=>{const n=(L-2*k)/((m+1)+ra*m),t=ra*n,a=[];let x=k;for(let i=0;i<=m;i++){a.push([x,x+n]);x+=n+t}return a},
    X=N(W,mx),Y=N(H,my),P=[[0,0]];
  X.forEach(([a,b])=>P.push([a,0],[a,d],[b,d],[b,0]));P.push([W,0]);
  Y.forEach(([a,b])=>P.push([W,a],[W-d,a],[W-d,b],[W,b]));P.push([W,H]);
  [...X].reverse().forEach(([a,b])=>P.push([b,H],[b,H-d],[a,H-d],[a,H]));P.push([0,H]);
  [...Y].reverse().forEach(([a,b])=>P.push([0,b],[d,b],[d,a],[0,a]));
  const R=P.flatMap((V,i)=>{const A=P[(i+P.length-1)%P.length],B=P[(i+1)%P.length],u=Q=>{const dx=Q[0]-V[0],dy=Q[1]-V[1],l=Math.hypot(dx,dy);return [V[0]+dx/l*rr,V[1]+dy/l*rr]};return [u(A),u(B)]});
  return 'polygon('+R.map(([x,y])=>x.toFixed(2)+'px '+y.toFixed(2)+'px').join(',')+')';
}
document.documentElement.style.setProperty('--stamp',stampPath());
const PALETTE=['#FFD60A','#FF4D8D','#2D6BFF','#19C37D','#FF7A1A','#8B5CF6','#00C2E0'];
const S={user:null,logs:[],trash:[],cats:[],idxs:[],month:new Date(),edit:null,img:undefined};
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>ymd(new Date());
const noon=d=>new Date(d+'T12:00:00').toISOString();
const doneDay=l=>l.done_at?ymd(new Date(l.done_at)):'';
const dd=s=>s?s.slice(5,10).replace('-','/'):'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),2400)}
function fail(e){if(e){toast('오류: '+e.message);return true}return false}
function fg(h){const n=parseInt(h.slice(1),16),l=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;return l>0.6?'#111':'#fff'}
const cat=id=>S.cats.find(c=>c.id===id), ix=id=>S.idxs.find(i=>i.id===id), find=id=>S.logs.find(l=>l.id===id);
const rep=l=>l.image_url||ix(l.index_id)?.image_url||cat(l.category_id)?.image_url||null;
const col=l=>cat(l.category_id)?.color||'#E4E4E4';
function ph(l,big){const u=Media.url(rep(l));return u?`<div class="ph" data-img="${esc(u)}"></div>`:`<div class="ph t3" style="color:${fg(col(l))}"><b>${Array.from(l.text||'').filter(c=>c.trim()).slice(0,3).map(esc).join('<br>')}</b></div>`}
function onDay(l,key,t){
  if(l.is_checked)return (doneDay(l)||l.log_date)===key;
  if(l.is_checked===null)return l.log_date===key;
  return l.log_date===key&&key>=t;
}

/* 인증 */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?.user||null;
  $('auth').classList.toggle('hide',!!S.user);$('app').classList.toggle('hide',!S.user);
  if(S.user)await loadAll();
}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(!fail(error))boot()};
$('signup').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});if(!fail(error)){toast('가입 완료. 메일 인증을 켰다면 확인하세요');boot()}};
$('logout').onclick=async()=>{await sb.auth.signOut();boot()};
const dirLabel=()=>Media.folder.name().then(n=>{$('dirbtn').textContent=n?'폴더: '+n+' (변경)':'폴더 연결'}).catch(()=>{});
$('dirbtn').onclick=async()=>{try{await Media.folder.connect();dirLabel()}catch(e){if(e.name!=='AbortError')toast(e.message||'이 브라우저에서는 지원하지 않아요')}};
$('syncbtn').onclick=async()=>{const m=$('syncmsg');try{m.textContent='받는 중…';const r=await Media.sync({onProgress:p=>m.textContent=p.done+'/'+p.total});m.textContent=r.total?`완료: ${r.done}/${r.total}`+(r.failed.length?` · 실패 ${r.failed.length}`:''):'받을 원본이 없어요'}catch(e){m.textContent=e.message}};
dirLabel();

/* 데이터 */
async function loadAll(){
  const [a,b,c,d]=await Promise.all([
    sb.from('didi_category').select('*').eq('is_archived',false).order('sort_order').order('created_at'),
    sb.from('didi_index').select('*').eq('is_archived',false).order('sort_order').order('created_at'),
    sb.from('didi_log').select('*').is('discarded_at',null).order('created_at').order('seq').limit(3000),
    sb.from('didi_log').select('*').not('discarded_at','is',null).order('discarded_at',{ascending:false}).limit(500)]);
  if(fail(a.error)||fail(b.error)||fail(c.error)||fail(d.error))return;
  S.cats=a.data||[];S.idxs=b.data||[];S.logs=c.data||[];S.trash=d.data||[];
  renderTodo();renderCal();renderDay();renderMore();
}
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs [data-t]').forEach(x=>x.classList.toggle('on',x===b));
  ['todo','cal','day','more'].forEach(t=>$('tab-'+t).classList.toggle('hide',t!==b.dataset.t));
});

/* 이미지: 공용 모듈(media.js). image_url에는 해시 16자만 저장하고, 원본은 폴더가 연결된 PC면 폴더에, 아니면 서버 inbox에 보관 */
$('busy').addEventListener('cancel',e=>e.preventDefault());
function pick(){return new Promise(res=>{const i=$('pick');i.value='';i.onchange=()=>res(i.files[0]||null);i.click()})}
async function uploadImg(file,id){
  $('busy').showModal();
  try{
    const s=await Media.save(file,{id});
    if(s.original==='failed')toast('원본 보관에 실패했어요: '+s.originalError);
    s.close();return s.hash;
  }finally{$('busy').close()}
}
function hydrate(){
  document.querySelectorAll('[data-img]:not([data-ok])').forEach(el=>{
    el.dataset.ok='1';if(!el.dataset.img)return;
    el.style.backgroundImage=`url('${el.dataset.img}')`;el.style.backgroundSize='cover';el.style.backgroundPosition='center';
  });
}
new MutationObserver(hydrate).observe(document.body,{childList:true,subtree:true});

/* 할 일 */
function renderTodo(){
  const t=today();
  const rows=S.logs.filter(l=>l.is_checked===false||(l.is_checked===true&&(doneDay(l)||l.log_date||t)>=t));
  $('list').innerHTML=rows.length?rows.map(l=>{
    const lim=ymd(new Date(Date.now()+3*864e5)),soon=!l.is_checked&&l.log_date&&l.log_date<=lim;
    return `<div class="todo ${l.is_checked?'done':soon?'soon':''}" data-id="${l.id}"><span class="t">${esc(l.text)}</span><span class="dt">${dd(l.log_date)}</span><input type="checkbox" data-c="${l.id}" ${l.is_checked?'checked':''} aria-label="완료"></div>`}).join(''):'<div class="empty">할 일이 없어요.</div>';
}
$('list').addEventListener('change',async e=>{
  const id=e.target.dataset.c;if(!id)return;
  const {error}=await sb.from('didi_log').update({is_checked:e.target.checked,done_at:e.target.checked?new Date().toISOString():null}).eq('id',id);
  if(!fail(error))loadAll();
});
$('list').addEventListener('contextmenu',e=>{const r=e.target.closest('.todo');if(!r)return;e.preventDefault();if(!$('dlg').open)openDlg(find(r.dataset.id),null,true)});
let lp;
$('list').addEventListener('touchstart',e=>{const r=e.target.closest('.todo');if(!r||e.target.matches('input'))return;clearTimeout(lp);lp=setTimeout(()=>{if(!$('dlg').open)openDlg(find(r.dataset.id),null,true)},550)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(n=>$('list').addEventListener(n,()=>clearTimeout(lp),{passive:true}));
$('addf').onsubmit=async e=>{
  e.preventDefault();const text=$('nt').value.trim();if(!text)return;
  const {error}=await sb.from('didi_log').insert({user_id:S.user.id,text,is_checked:false});
  if(fail(error))return;$('nt').value='';await loadAll();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});$('nt').focus();
};

/* 캘린더 / 날짜별 */
document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
  const v=+b.dataset.mv;S.month=v?new Date(S.month.getFullYear(),S.month.getMonth()+v,1):new Date();renderCal();renderDay()});
function renderCal(){
  const y=S.month.getFullYear(),m=S.month.getMonth(),first=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),t=today();
  document.querySelectorAll('.ml').forEach(e=>e.textContent=y+'년 '+(m+1)+'월');
  let h='일월화수목금토'.split('').map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="cell blank"></div>'.repeat(first.getDay());
  for(let d=1;d<=n;d++){
    const key=y+'-'+z(m+1)+'-'+z(d);
    const it=S.logs.filter(l=>onDay(l,key,t)).map(l=>`<div class="st ${l.is_checked?'done':''}" data-id="${l.id}" style="background:${col(l)};color:${fg(col(l))}">${esc(l.text)}</div>`).join('');
    h+=`<div class="cell ${key===t?'today':''}" data-d="${key}"><div class="dn">${d}</div>${it}</div>`;
  }
  $('cal').innerHTML=h;
}
$('cal').onclick=e=>{const c=e.target.closest('.cell[data-d]');if(!c)return;const st=e.target.closest('.st');openDlg(st?find(st.dataset.id):null,c.dataset.d)};
function renderDay(){
  const y=S.month.getFullYear(),m=S.month.getMonth(),n=new Date(y,m+1,0).getDate(),t=today();let h='';
  for(let d=1;d<=n;d++){
    const key=y+'-'+z(m+1)+'-'+z(d),it=S.logs.filter(l=>l.is_checked&&(doneDay(l)||l.log_date)===key);if(!it.length)continue;
    h+=`<div class="dayrow"><div class="dl">${m+1}/${d}<br><small>${'일월화수목금토'[new Date(y,m,d).getDay()]}</small></div><div class="stamps">${it.map(l=>`<div class="sw"><div class="stamp" data-id="${l.id}" style="background:${col(l)}" title="${esc(l.text)}">${ph(l)}</div></div>`).join('')}</div></div>`;
  }
  $('days').innerHTML=h||'<div class="empty">이 달에는 기록이 없어요.</div>';
}
$('days').onclick=e=>{const s=e.target.closest('.stamp');if(s)openDlg(find(s.dataset.id))};

/* 팝업 */
function fillCat(v){$('f-cat').innerHTML='<option value="">분류 없음</option>'+S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'<option value="__new">+ 새 분류</option>';$('f-cat').value=v||''}
function fillIdx(v){const c=$('f-cat').value;$('f-idx').innerHTML='<option value="">인덱스 없음</option>'+S.idxs.filter(i=>(i.category_id||'')===c).map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')+'<option value="__new">+ 새 인덱스</option>';$('f-idx').value=v||''}
function prev(){const o={...(S.edit||{}),text:$('f-t').value,image_url:S.img!==undefined?S.img:S.edit?.image_url,index_id:$('f-idx').value,category_id:$('f-cat').value};$('f-prev').style.background=col(o);$('f-prev').innerHTML=ph(o,1)}
async function newCat(){
  const name=(prompt('새 분류 이름')||'').trim();if(!name){fillCat('');fillIdx('');return}
  const {data,error}=await sb.from('didi_category').insert({user_id:S.user.id,name,color:PALETTE[S.cats.length%PALETTE.length],sort_order:S.cats.length}).select().single();
  if(fail(error)){fillCat('');return}S.cats.push(data);fillCat(data.id);fillIdx('');
}
async function newIdx(cid){
  const name=(prompt('새 인덱스 이름')||'').trim();if(!name)return null;
  const {data,error}=await sb.from('didi_index').insert({user_id:S.user.id,name,category_id:cid||null,sort_order:S.idxs.length}).select().single();
  if(fail(error))return null;S.idxs.push(data);return data;
}
$('f-cat').onchange=async()=>{if($('f-cat').value==='__new')await newCat();else fillIdx('');prev()};
$('f-idx').onchange=async()=>{if($('f-idx').value==='__new'){const c=$('f-cat').value,d=await newIdx(c==='__new'?'':c);fillIdx(d?d.id:'')}prev()};
function setMode(edit){
  $('dlg').classList.toggle('view',!edit);
  $('dlg').querySelectorAll('input,select,textarea').forEach(e=>e.disabled=!edit);
  $('dtitle').textContent=!S.edit?'새 기록':edit?'수정':'상세 보기';
}
function openDlg(log,date,edit){
  S.edit=log||null;S.img=undefined;S.rid=log?log.id:Media.newId();const x=log&&ix(log.index_id);
  $('f-t').value=log?log.text:'';
  $('f-cr').value=log?ymd(new Date(log.created_at)):'';
  $('f-d').value=log?(log.log_date||''):(date||'');
  $('f-c').checked=!!(log&&log.is_checked);
  $('f-dn').value=log?doneDay(log):'';
  $('f-m').value=log?(log.meta?.memo||''):'';
  fillCat(x?x.category_id:log?.category_id);fillIdx(log?.index_id);
  document.querySelectorAll('.ext').forEach(e=>e.classList.toggle('hide',!log));
  $('f-danger').classList.toggle('hide',!log);
  S.ref=undefined;linkUi();refTxt();setMode(!log||edit);prev();$('dlg').showModal();
  if(log&&Media.folder.supported)Media.folder.fileUrl(log.id).then(u=>{const e=$('f-prev').querySelector('.ph[data-img]');if(u&&e&&S.edit&&S.edit.id===log.id)e.style.backgroundImage=`url('${u}')`}).catch(()=>{});
}
$('f-edit').onclick=()=>setMode(true);
$('f-x').onclick=()=>$('dlg').close();
$('f-c').onchange=()=>{$('f-dn').value=$('f-c').checked?($('f-dn').value||today()):''};
$('f-dn').onchange=()=>{$('f-c').checked=!!$('f-dn').value};
const curCat=()=>{const x=ix($('f-idx').value);return x?x.category_id:$('f-cat').value};
function linkUi(){const c=curCat(),b=c===CAT_BOOK,v=c===CAT_MOVIE;$('f-link').classList.toggle('hide',!(b||v));$('f-gal').classList.toggle('hide',!(b||v));$('f-link').textContent=b?'독서 연결':'영상 연결'}
function refTxt(){const r=S.ref===undefined?S.edit?.meta?.ref:S.ref;$('f-ref').textContent=r?(r.t==='bkbk_books'?'📖 ':'🎬 ')+(r.name||''):''}
$('f-cat').addEventListener('change',()=>setTimeout(linkUi,0));$('f-idx').addEventListener('change',()=>setTimeout(linkUi,0));
function choose(items,ph){return new Promise(res=>{   // 사진이 있는 항목 중 하나 고르기
  const d=$('pk'),l=$('pk-l'),q=$('pk-q');q.value='';q.hidden=!ph;q.placeholder=ph||'';
  const draw=()=>{const t=q.value.trim().toLowerCase();l.innerHTML=items.map((o,i)=>[o,i]).filter(([o])=>!t||(o.title||'').toLowerCase().includes(t)).map(([o,i])=>`<div data-i="${i}" style="cursor:pointer;font-size:11px"><div style="height:110px;border-radius:6px;background:#8883 center/contain no-repeat url('${Media.url(o.hash)}')"></div><div>${esc(o.title||'')}</div></div>`).join('')||'<p class="hint">없어요</p>'};
  q.oninput=draw;draw();
  l.onclick=e=>{const c=e.target.closest('[data-i]');if(c){d.close();res(items[c.dataset.i])}};
  $('pk-x').onclick=()=>{d.close();res(null)};d.oncancel=()=>res(null);d.showModal()})}
$('f-link').onclick=async()=>{
  const book=curCat()===CAT_BOOK;
  try{
    let items;
    if(book){
      const [b,r]=await Promise.all([sb.from('bkbk_books').select('id,series,volume,label,cover').not('cover','is',null).order('created_at',{ascending:false}).limit(1000),sb.from('bkbk_series').select('id,name')]);
      if(b.error||r.error)throw new Error((b.error||r.error).message);
      const sn=Object.fromEntries(r.data.map(x=>[x.id,x.name]));
      items=b.data.map(x=>({hash:x.cover,title:[sn[x.series],x.volume!=null?x.volume+'권':'',x.label].filter(Boolean).join(' ')||'(제목 없음)',ref:{t:'bkbk_books',id:x.id}}));
    }else{
      const m=await sb.from('mvmv_movie').select('id,name,poster').not('poster','is',null).order('created_at',{ascending:false}).limit(1000);
      if(m.error)throw new Error(m.error.message);
      items=m.data.map(x=>({hash:x.poster,title:x.name,ref:{t:'mvmv_movie',id:x.id}}));
    }
    const o=await choose(items,book?'책 검색':'영상 검색');if(!o)return;
    S.img=o.hash;S.ref={...o.ref,name:o.title};if(!$('f-t').value.trim())$('f-t').value=o.title;refTxt();prev();
  }catch(e){toast(e.message)}
};
$('f-gal').onclick=async()=>{
  try{
    const L=(await Media.list('images/')).filter(o=>/^images\/[0-9a-f]{16}\.webp$/.test(o.key)).sort((a,b)=>new Date(b.uploaded)-new Date(a.uploaded));
    const o=await choose(L.map(x=>({hash:x.key.slice(7,-5)})),'');if(!o)return;
    S.img=o.hash;S.ref=null;refTxt();prev();
  }catch(e){toast(e.message)}
};
$('f-pick').onclick=async()=>{const f=await pick();if(!f)return;try{S.img=await uploadImg(f,S.rid);prev();toast('사진을 올렸어요')}catch(e){toast(e.message)}};
$('f-rm').onclick=()=>{S.img=null;S.ref=null;refTxt();prev()};
$('f-t').oninput=prev;
$('f-ok').onclick=async()=>{
  const text=$('f-t').value.trim();if(!text){toast('내용을 입력하세요');return}
  const x=ix($('f-idx').value),cv=$('f-cat').value;
  const base={text,log_date:$('f-d').value||null,index_id:x?x.id:null,category_id:x?x.category_id:(cv&&cv!=='__new'?cv:null)};
  if(S.img!==undefined)base.image_url=S.img;
  const meta={...(S.edit?.meta||{}),memo:$('f-m').value};if(S.ref!==undefined){if(S.ref)meta.ref=S.ref;else delete meta.ref}let r;
  if(S.edit){
    const c=$('f-c').checked,dn=$('f-dn').value,cr=$('f-cr').value,upd={...base,meta,is_checked:c,done_at:null};
    if(c)upd.done_at=(dn&&dn===doneDay(S.edit))?S.edit.done_at:(dn?noon(dn):new Date().toISOString());
    if(cr&&cr!==ymd(new Date(S.edit.created_at)))upd.created_at=noon(cr);
    r=await sb.from('didi_log').update(upd).eq('id',S.edit.id);
  }else r=await sb.from('didi_log').insert({...base,meta,id:S.rid,user_id:S.user.id,is_checked:false});
  if(!fail(r.error)){$('dlg').close();loadAll()}
};
$('f-disc').onclick=async()=>{
  if(!confirm('버릴까요? 목록에서는 사라지고 더보기 > 휴지통에 보관돼요.'))return;
  const {error}=await sb.from('didi_log').update({discarded_at:new Date().toISOString()}).eq('id',S.edit.id);
  if(!fail(error)){$('dlg').close();loadAll()}
};
$('f-del').onclick=async()=>{
  if(!confirm('완전히 삭제할까요? 되돌릴 수 없어요.'))return;
  const {error}=await sb.from('didi_log').delete().eq('id',S.edit.id);
  if(!fail(error)){$('dlg').close();loadAll()}
};

/* 더보기: 분류/인덱스 관리 + 휴지통 */
function renderMore(){
  const th=(o,c)=>`<span class="thm" style="background:${c}" ${Media.url(o.image_url)?`data-img="${esc(Media.url(o.image_url))}"`:''}></span>`;
  const btn='<button class="plain" data-a="img">사진</button><button class="plain" data-a="ren">이름</button>';
  const irow=(i,sub)=>`<div class="mr ${sub?'sub':''}" data-k="didi_index" data-id="${i.id}">${th(i,'#E4E4E4')}<span class="t">${esc(i.name)}</span>${btn}<button class="red" data-a="del">삭제</button></div>`;
  let h='<h3>분류 · 인덱스</h3>';
  for(const c of S.cats){
    h+=`<div class="mr" data-k="didi_category" data-id="${c.id}">${th(c,c.color)}<b class="t">${esc(c.name)}</b><input type="color" value="${c.color}" data-col="${c.id}" style="width:34px;height:26px;padding:1px">${btn}<button data-a="add">+인덱스</button>${LOCKED.has(c.id)?'<span class="hint">🔒 고정</span>':'<button class="red" data-a="del">삭제</button>'}</div>`;
    h+=S.idxs.filter(i=>i.category_id===c.id).map(i=>irow(i,1)).join('');
  }
  h+=S.idxs.filter(i=>!i.category_id||!cat(i.category_id)).map(i=>irow(i,0)).join('');
  h+='<div style="margin-top:8px"><button id="addcat">+ 분류 추가</button></div>';
  h+=`<h3>휴지통 (${S.trash.length})</h3>`+(S.trash.length?S.trash.map(l=>`<div class="mr" data-k="didi_log" data-id="${l.id}"><span class="t">${esc(l.text)}</span><span class="dt">${dd(ymd(new Date(l.discarded_at)))}</span><button class="plain" data-a="res">복원</button><button class="red" data-a="rm">삭제</button></div>`).join(''):'<div class="empty">비어 있어요.</div>');
  $('more').innerHTML=h;
}
$('more').addEventListener('change',async e=>{
  if(!e.target.dataset.col)return;
  const {error}=await sb.from('didi_category').update({color:e.target.value}).eq('id',e.target.dataset.col);
  if(!fail(error))loadAll();
});
$('more').addEventListener('click',async e=>{
  if(e.target.id==='addcat'){const n=(prompt('새 분류 이름')||'').trim();if(!n)return;
    const {error}=await sb.from('didi_category').insert({user_id:S.user.id,name:n,color:PALETTE[S.cats.length%PALETTE.length],sort_order:S.cats.length});if(!fail(error))loadAll();return}
  const a=e.target.dataset.a,row=e.target.closest('.mr');if(!a||!row)return;
  const tb=row.dataset.k,id=row.dataset.id;let r;
  if(a==='img'){const f=await pick();if(!f)return;try{r=await sb.from(tb).update({image_url:await uploadImg(f,id)}).eq('id',id)}catch(err){toast(err.message);return}}
  else if(a==='ren'){const o=(tb==='didi_category'?cat(id):ix(id)),n=(prompt('이름',o.name)||'').trim();if(!n)return;r=await sb.from(tb).update({name:n}).eq('id',id)}
  else if(a==='add'){const d=await newIdx(id);if(d)loadAll();return}
  else if(a==='del'){if(tb==='didi_category'&&LOCKED.has(id)){toast('독서·영상 분류는 삭제할 수 없어요');return}if(!confirm('삭제할까요? 연결된 기록은 남고 분류/인덱스만 비워져요.'))return;r=await sb.from(tb).delete().eq('id',id)}
  else if(a==='res')r=await sb.from('didi_log').update({discarded_at:null}).eq('id',id);
  else if(a==='rm'){if(!confirm('완전히 삭제할까요?'))return;r=await sb.from('didi_log').delete().eq('id',id)}
  if(r&&!fail(r.error))loadAll();
});

/* 앱 설치 안내 + 점검 */
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;showInst()});
async function pwaCheck(){
  const out=[],ok=(t,v)=>out.push((v?'✅ ':'❌ ')+t);
  ok('HTTPS 접속',location.protocol==='https:');
  try{const r=await fetch('manifest.json');ok('manifest.json 파일',r.ok);const m=await r.json();
    for(const i of m.icons||[]){try{ok('아이콘 '+i.sizes+(i.purpose==='maskable'?' (maskable)':''),(await fetch(i.src)).ok)}catch(e){ok('아이콘 '+i.sizes,false)}}
  }catch(e){ok('manifest.json 파일',false)}
  let reg=null;try{reg=await navigator.serviceWorker.getRegistration()}catch(e){}
  ok('서비스 워커 등록',!!reg);
  return out;
}
async function showInst(){
  const ua=navigator.userAgent,sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let h=sa?'<b>설치된 앱으로 실행 중이에요.</b>':dp?'<button id="instbtn">앱 설치</button>':/iphone|ipad|ipod/i.test(ua)?'아이폰: 사파리에서 공유 버튼 → "홈 화면에 추가"':'크롬 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"';
  if(/KAKAOTALK|NAVER|FBAN|FBAV|Instagram|Line\//i.test(ua))h+='<br>⚠️ 앱 안의 브라우저예요. 크롬이나 사파리로 열어 주세요.';
  h+='<br>'+(await pwaCheck()).join('<br>');
  $('inst').innerHTML=h;
  const b=$('instbtn');if(b)b.onclick=async()=>{dp.prompt();await dp.userChoice;dp=null;showInst()};
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(showInst).catch(showInst);else showInst();
boot();
</script>
