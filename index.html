<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1e293b;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .paper-pad {
            width: 100vw;
            height: 100vh;
            max-width: 720px;
            max-height: 480px;
            background-color: #fbf9f1;
            background-image: repeating-linear-gradient(#fbf9f1, #fbf9f1 27px, #e8e3d5 28px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-radius: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid #dcd6c5;
        }

        @media (min-width: 720px) {
            .paper-pad {
                border-radius: 8px;
            }
        }

        .paper-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #334155;
            border-radius: 3px;
            background: white;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .paper-checkbox:checked {
            background-color: #334155;
            border-color: #1e293b;
        }

        .paper-checkbox:checked::after {
            content: '✓';
            position: absolute;
            font-size: 11px;
            color: white;
            top: -1px;
            left: 2px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4cfc4;
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased">

    <div class="paper-pad flex flex-col w-full h-full">
        
        <!-- 상단 헤더 (탭 및 로그아웃) -->
        <div class="px-5 py-3 border-b border-gray-300 flex justify-between items-center bg-[#f5f2e6]">
            <div class="flex items-center space-x-4">
                <h1 class="text-sm font-bold text-gray-800 tracking-wider">DIDI</h1>
                <div id="tab-nav" class="space-x-3 text-xs hidden">
                    <button onclick="switchTab('todo')" id="btn-tab-todo" class="font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5">TODO</button>
                    <button onclick="switchTab('calendar')" id="btn-tab-calendar" class="text-gray-400 hover:text-gray-700 pb-0.5">CALENDAR</button>
                </div>
            </div>
            <div id="header-actions"></div>
        </div>

        <!-- 로그인 / 회원가입 뷰 -->
        <div id="auth-view" class="flex-1 flex flex-col justify-center px-8 py-4 text-sm">
            <div class="text-center font-bold text-gray-800 mb-4" id="auth-mode-title">로그인</div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3 max-w-sm mx-auto w-full">
                <input type="email" id="auth-email" placeholder="이메일" required
                    class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-xs text-gray-800 focus:outline-none focus:border-gray-500">
                <input type="password" id="auth-password" placeholder="비밀번호 (6자 이상)" required minlength="6"
                    class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-xs text-gray-800 focus:outline-none focus:border-gray-500">
                <button type="submit" id="auth-submit-btn" class="w-full bg-gray-800 text-white rounded py-2 font-medium hover:bg-gray-700 transition text-xs">로그인</button>
            </form>
            <div class="text-center mt-4">
                <button type="button" onclick="toggleAuthMode()" class="text-xs text-gray-500 hover:underline" id="auth-switch-text">
                    계정이 없으신가요? 회원가입
                </button>
            </div>
            <div id="auth-error" class="text-red-600 text-xs text-center mt-3 hidden"></div>
        </div>

        <!-- 메인 앱 컨테이너 (로그인 후 표시) -->
        <div id="app-main-view" class="flex-1 flex flex-col overflow-hidden hidden">
            
            <!-- 1. TODO 탭 화면 -->
            <div id="view-todo" class="flex-1 flex flex-col overflow-hidden">
                <!-- 삭제 확인 모달 -->
                <div id="delete-modal" class="absolute inset-0 bg-black/30 z-40 flex items-center justify-center hidden p-4">
                    <div class="bg-[#fbf9f1] border border-gray-400 rounded p-4 w-64 shadow-lg text-center">
                        <p class="text-xs text-gray-800 mb-3">이 항목을 삭제하시겠습니까?</p>
                        <div class="flex justify-center space-x-2">
                            <button id="confirm-delete-btn" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs hover:bg-red-700">삭제</button>
                            <button onclick="closeDeleteModal()" class="bg-gray-300 text-gray-700 px-3 py-1.5 rounded text-xs hover:bg-gray-400">취소</button>
                        </div>
                    </div>
                </div>

                <div id="todo-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-2 text-xs">
                    <!-- 동적 렌더링 -->
                </div>

                <form id="todo-form" onsubmit="addIndexTask(event)" class="px-4 py-3 border-t border-gray-300 bg-[#f5f2e6]">
                    <input type="text" id="task-input" placeholder="새로운 할 일 입력 후 엔터..." required
                        class="w-full bg-transparent text-xs text-gray-800 placeholder-gray-400 focus:outline-none border-b border-dashed border-gray-400 pb-1">
                </form>
            </div>

            <!-- 2. CALENDAR 탭 화면 (스크롤 가능, 인덱스 스티커 쌓임) -->
            <div id="view-calendar" class="flex-1 flex flex-col overflow-y-auto p-4">
                <div class="flex justify-between items-center mb-3">
                    <button onclick="changeMonth(-1)" class="text-xs px-2 py-1 bg-gray-200 rounded hover:bg-gray-300"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendar-title" class="text-xs font-bold text-gray-800">2026년 6월</h2>
                    <button onclick="changeMonth(1)" class="text-xs px-2 py-1 bg-gray-200 rounded hover:bg-gray-300"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <!-- 캘린더 그리드 -->
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-gray-600 mb-1 sticky top-0 bg-[#fbf9f1] py-1 z-10">
                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-xs">
                    <!-- 달력 날짜 및 스티커 동적 생성 -->
                </div>
            </div>

        </div>

    </div>

    <script>
        // 새로운 Supabase 프로젝트 정보 적용 완료
        const SUPABASE_URL = 'https://rtvvajhsnwkkrmncyfbs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';

        let supabaseClient = null;
        let currentUser = null;
        let indexTasks = [];      
        let todayLogs = [];       
        let monthLogs = [];       
        let pendingDeleteId = null;
        let isSignUpMode = false;

        let currentCalendarDate = new Date();

        window.onload = async function() {
            try {
                if (!window.supabase) {
                    throw new Error('Supabase SDK 로드 실패');
                }
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;

                if (session && session.user) {
                    currentUser = session.user;
                    showAppView();
                } else {
                    showAuthView();
                }

                supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (session && session.user) {
                        currentUser = session.user;
                        showAppView();
                    } else {
                        currentUser = null;
                        showAuthView();
                    }
                });
            } catch (e) {
                console.error('Supabase init error:', e);
                showAuthView();
            }
        };

        function showAuthView() {
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('app-main-view').classList.add('hidden');
            document.getElementById('tab-nav').classList.add('hidden');
            document.getElementById('header-actions').innerHTML = '';
        }

        function showAppView() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-main-view').classList.remove('hidden');
            document.getElementById('tab-nav').classList.remove('hidden');
            document.getElementById('header-actions').innerHTML = `
                <button onclick="logout()" class="text-gray-500 hover:text-red-600 text-xs" title="로그아웃">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            `;
            loadTodoData();
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-mode-title').innerText = isSignUpMode ? '회원가입' : '로그인';
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? '가입하기' : '로그인';
            document.getElementById('auth-switch-text').innerText = isSignUpMode ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입';
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            try {
                if (isSignUpMode) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('회원가입이 완료되었습니다!');
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        async function logout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
        }

        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return dateStr.toString().substring(0, 10);
        }

        function switchTab(tabName) {
            const todoView = document.getElementById('view-todo');
            const calendarView = document.getElementById('view-calendar');
            const btnTodo = document.getElementById('btn-tab-todo');
            const btnCalendar = document.getElementById('btn-tab-calendar');

            if (tabName === 'todo') {
                todoView.classList.remove('hidden');
                calendarView.classList.add('hidden');
                btnTodo.className = "font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5";
                btnCalendar.className = "text-gray-400 hover:text-gray-700 pb-0.5";
                loadTodoData();
            } else {
                todoView.classList.add('hidden');
                calendarView.classList.remove('hidden');
                btnCalendar.className = "font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5";
                btnTodo.className = "text-gray-400 hover:text-gray-700 pb-0.5";
                loadCalendarData();
            }
        }

        async function loadTodoData() {
            if (!supabaseClient || !currentUser) return;
            const today = getTodayDateString();

            try {
                const { data: indexData, error: indexErr } = await supabaseClient
                    .from('didi_index')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('id', { ascending: true });

                if (indexErr) throw indexErr;
                indexTasks = indexData || [];

                const { data: logData, error: logErr } = await supabaseClient
                    .from('didi_log')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('log_date', today);

                if (logErr) throw logErr;
                todayLogs = logData || [];

                renderTodoList();
            } catch (err) {
                console.error('Load todo error:', err);
            }
        }

        async function addIndexTask(e) {
            e.preventDefault();
            const inputEl = document.getElementById('task-input');
            const textContent = inputEl.value.trim();
            if (!textContent || !currentUser) return;

            const newIndex = {
                text: textContent,
                user_id: currentUser.id
            };

            try {
                const { data, error } = await supabaseClient
                    .from('didi_index')
                    .insert([newIndex])
                    .select();

                if (error) throw error;
                if (data && data.length > 0) {
                    indexTasks.push(data[0]);
                }
                inputEl.value = '';
                renderTodoList();
            } catch (err) {
                console.error('Insert index error:', err);
                alert('저장 실패: ' + err.message);
            }
        }

        async function toggleTaskLog(indexId) {
            const today = getTodayDateString();
            const existingLog = todayLogs.find(l => l.index_id == indexId);

            try {
                if (existingLog) {
                    const newCheck = !existingLog.is_checked;
                    const { error } = await supabaseClient
                        .from('didi_log')
                        .update({ is_checked: newCheck })
                        .eq('id', existingLog.id);

                    if (error) throw error;
                    existingLog.is_checked = newCheck;
                } else {
                    const newLog = {
                        user_id: currentUser.id,
                        index_id: indexId,
                        log_date: today,
                        is_checked: true
                    };
                    const { data, error } = await supabaseClient
                        .from('didi_log')
                        .insert([newLog])
                        .select();

                    if (error) throw error;
                    if (data && data.length > 0) {
                        todayLogs.push(data[0]);
                    }
                }
                renderTodoList();
            } catch (err) {
                console.error('Toggle log error:', err);
            }
        }

        function renderTodoList() {
            const listEl = document.getElementById('todo-list');
            listEl.innerHTML = '';

            if (indexTasks.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs italic">등록된 할 일이 없습니다.</div>`;
                return;
            }

            indexTasks.forEach(task => {
                const log = todayLogs.find(l => l.index_id == task.id);
                const isChecked = log ? log.is_checked : false;
                const displayDate = log && isChecked ? formatDate(log.created_at) : '';

                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between py-1.5 border-b border-gray-200/60 group ${isChecked ? 'opacity-60' : ''}`;
                
                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden pr-1 flex-1">
                        <input type="checkbox" class="paper-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTaskLog('${task.id}')">
                        <div class="flex items-center justify-between overflow-hidden flex-1 text-xs">
                            <span class="truncate text-gray-800 ${isChecked ? 'line-through text-gray-500' : ''}" title="${escapeHtml(task.text)}">
                                ${escapeHtml(task.text)}
                            </span>
                            <span class="text-[10px] text-gray-400 ml-2 whitespace-nowrap">
                                ${displayDate}
                            </span>
                        </div>
                    </div>
                    <button onclick="promptDelete('${task.id}', event)" class="text-gray-300 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100 transition px-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                listEl.appendChild(itemDiv);
            });
        }

        function promptDelete(id, event) {
            event.stopPropagation();
            pendingDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
            document.getElementById('confirm-delete-btn').onclick = function() {
                executeDeleteIndex(pendingDeleteId);
            };
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById('delete-modal').classList.add('hidden');
        }

        async function executeDeleteIndex(id) {
            closeDeleteModal();
            try {
                const { error } = await supabaseClient
                    .from('didi_index')
                    .delete()
                    .eq('id', id)
                    .eq('user_id', currentUser.id);

                if (error) throw error;
                indexTasks = indexTasks.filter(t => t.id != id);
                renderTodoList();
            } catch (err) {
                console.error('Delete index error:', err);
            }
        }

        async function loadCalendarData() {
            if (!supabaseClient || !currentUser) return;

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            const startDate = `${year}-${String(month + 1).padStart(2, '0')}-01`;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const endDate = `${year}-${String(month + 1).padStart(2, '0')}-${lastDay}`;

            document.getElementById('calendar-title').innerText = `${year}년 ${month + 1}월`;

            try {
                const { data, error } = await supabaseClient
                    .from('didi_log')
                    .select('*, didi_index(text)')
                    .eq('user_id', currentUser.id)
                    .gte('log_date', startDate)
                    .lte('log_date', endDate);

                if (error) throw error;
                monthLogs = data || [];
                renderCalendarGrid(year, month);
            } catch (err) {
                console.error('Load calendar error:', err);
            }
        }

        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            loadCalendarData();
        }

        function renderCalendarGrid(year, month) {
            const gridEl = document.getElementById('calendar-grid');
            gridEl.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const dayLogs = monthLogs.filter(l => l.log_date === dateStr && l.is_checked);

                const cellDiv = document.createElement('div');
                cellDiv.className = `border border-gray-300/60 rounded p-1 flex flex-col items-start bg-white/40 min-h-[75px] overflow-hidden`;
                
                let stickersHtml = '';
                if (dayLogs.length > 0) {
                    dayLogs.forEach(log => {
                        const taskText = (log.didi_index && log.didi_index.text) ? log.didi_index.text : '항목';
                        stickersHtml += `<div class="w-full bg-[#f3ecd8] border border-[#d6cfbe] rounded px-1 py-0.5 text-[9px] text-gray-800 truncate mt-0.5 shadow-2xs" title="${escapeHtml(taskText)}">${escapeHtml(taskText)}</div>`;
                    });
                }

                cellDiv.innerHTML = `
                    <span class="text-[11px] font-bold text-gray-700">${day}</span>
                    <div class="w-full mt-0.5 flex flex-col space-y-0.5">
                        ${stickersHtml}
                    </div>
                `;

                gridEl.appendChild(cellDiv);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
