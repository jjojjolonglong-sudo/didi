<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디디 다이어리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#111;--bg:#fff;--yel:#FFD60A;--pink:#FF4D8D;--blue:#2D6BFF;--gray:#E4E4E4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:16px}
body{min-width:340px;max-width:960px;margin:0 auto;padding:12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:2px solid var(--ink);border-radius:6px;padding:8px;background:#fff;min-width:0;width:100%}
textarea{min-height:80px;max-height:200px;resize:vertical}
button{cursor:pointer;border:2px solid var(--ink);border-radius:6px;background:var(--yel);padding:8px 14px;font-weight:700}
button.plain{background:#fff}
button.red{background:var(--pink)}
.hide{display:none!important}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;background:#fff;padding:12px}
.tabs button.on{background:var(--blue);color:#fff}
.wrap{max-width:640px;margin:0 auto}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.add .full{grid-column:1/-1}
h3{margin:18px 0 6px;font-size:15px}
.todo{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--gray);cursor:pointer}
.todo input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--blue)}
.todo .t{flex:1;min-width:0;word-break:break-word}
.todo.done .t{text-decoration:line-through;color:#888}
.dt{font-size:13px;flex:none}.dt.late{color:var(--pink);font-weight:700}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;flex:none;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:#888;padding:14px 0}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-size:20px}
.scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:4px;min-width:340px}
.wd{text-align:center;font-weight:700;font-size:13px}
.cell{min-height:88px;max-height:170px;overflow-y:auto;border:2px solid var(--ink);border-radius:6px;padding:3px;cursor:pointer}
.cell.today{background:#FFF6B8;border-width:3px}
.cell.blank{border:0;cursor:default}
.dn{font-size:12px;font-weight:700}
.st{margin-top:3px;padding:2px 5px;min-height:20px;font-size:12px;line-height:16px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done{opacity:.45;text-decoration:line-through}
dialog{width:min(92vw,420px);min-width:280px;border:3px solid var(--ink);border-radius:10px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px}
</style>
</head>
<body>

<script>
const SUPABASE_URL = 'https://rtvvajhsnwkkrmncyfbs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';
</script>

<section id="auth" class="wrap hide">
  <h2>디디 다이어리</h2>
  <div style="display:grid;gap:8px">
    <input id="em" type="email" placeholder="이메일" autocomplete="email">
    <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div class="row"><button id="login" style="flex:1">로그인</button><button id="signup" class="plain" style="flex:1">가입</button></div>
  </div>
</section>

<main id="app" class="hide">
  <div class="tabs">
    <button data-t="todo" class="on">할 일</button>
    <button data-t="cal">캘린더</button>
    <button id="logout" class="plain" style="flex:none;padding:12px 10px" title="로그아웃">나가기</button>
  </div>

  <section id="tab-todo" class="wrap">
    <div class="add">
      <input id="nt" class="full" placeholder="할 일을 적고 Enter">
      <input id="nd" type="date">
      <select id="ni"></select>
    </div>
    <h3>할 일</h3><div id="open"></div>
    <h3>완료</h3><div id="closed"></div>
  </section>

  <section id="tab-cal" class="hide">
    <div class="cal-head">
      <button id="mp" class="plain" aria-label="이전 달">‹</button>
      <div class="row"><b id="ml"></b><button id="mt" class="plain">오늘</button></div>
      <button id="mn" class="plain" aria-label="다음 달">›</button>
    </div>
    <div class="scroll"><div class="cal" id="cal"></div></div>
  </section>
</main>

<dialog id="dlg">
  <div id="dtitle" style="font-weight:700;font-size:18px"></div>
  <label for="f-t">내용</label><input id="f-t">
  <label for="f-d">날짜</label><input id="f-d" type="date">
  <label for="f-i">폴더</label><select id="f-i"></select>
  <label for="f-m">메모</label><textarea id="f-m" placeholder="장소, 시간, 생각 등 자유롭게"></textarea>
  <label id="f-cw" class="row" style="margin-top:12px"><input id="f-c" type="checkbox" style="width:22px;height:22px"> 완료</label>
  <div class="row" style="margin-top:16px;justify-content:flex-end">
    <button id="f-del" class="red">삭제</button>
    <button id="f-x" class="plain">닫기</button>
    <button id="f-ok">저장</button>
  </div>
</dialog>
<div id="toast" class="hide"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const PALETTE = ['#FFD60A','#FF4D8D','#2D6BFF','#19C37D','#FF7A1A','#8B5CF6','#00C2E0'];
const S = {user:null, logs:[], idx:[], month:new Date(), edit:null};
const z = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),2400)}
function fail(e){if(e){toast('오류: '+e.message);return true}return false}
function fg(hex){const n=parseInt(hex.slice(1),16),l=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;return l>0.6?'#111':'#fff'}
const color = id => (S.idx.find(i=>i.id===id)||{}).color || '#E4E4E4';
const folder = id => S.idx.find(i=>i.id===id);

/* 인증 */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  S.user = session?.user || null;
  $('auth').classList.toggle('hide', !!S.user);
  $('app').classList.toggle('hide', !S.user);
  if(S.user){ $('nd').value=ymd(new Date()); await loadAll(); }
}
$('login').onclick = async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value}); if(!fail(error))boot()};
$('signup').onclick = async()=>{const {error}=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value}); if(!fail(error)){toast('가입 완료. 메일 인증을 켰다면 메일을 확인하세요');boot()}};
$('logout').onclick = async()=>{await sb.auth.signOut(); boot()};

/* 데이터 */
async function loadAll(){
  const [a,b] = await Promise.all([
    sb.from('didi_index').select('*').eq('is_archived',false).order('sort_order').order('created_at'),
    sb.from('didi_log').select('*').order('log_date').order('sort_order').order('created_at').limit(2000)
  ]);
  if(fail(a.error)||fail(b.error))return;
  S.idx=a.data||[]; S.logs=b.data||[]; renderFolderSelects(); renderTodo(); renderCal();
}
function renderFolderSelects(){
  const opts = '<option value="">폴더 없음</option>'+S.idx.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')+'<option value="__new">+ 새 폴더 만들기</option>';
  for(const id of ['ni','f-i']){const v=$(id).value; $(id).innerHTML=opts; $(id).value=S.idx.some(i=>i.id===v)?v:'';}
}
async function newFolder(sel){
  const name=(prompt('새 폴더 이름')||'').trim();
  if(!name){sel.value='';return}
  const {data,error}=await sb.from('didi_index').insert({user_id:S.user.id,name,color:PALETTE[S.idx.length%PALETTE.length],sort_order:S.idx.length}).select().single();
  if(fail(error)){sel.value='';return}
  S.idx.push(data); renderFolderSelects(); sel.value=data.id;
}
$('ni').onchange=e=>{if(e.target.value==='__new')newFolder(e.target)};
$('f-i').onchange=e=>{if(e.target.value==='__new')newFolder(e.target)};

/* 탭 */
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs [data-t]').forEach(x=>x.classList.toggle('on',x===b));
  $('tab-todo').classList.toggle('hide',b.dataset.t!=='todo');
  $('tab-cal').classList.toggle('hide',b.dataset.t!=='cal');
});

/* 할 일 */
function todoRow(l){
  const f=folder(l.index_id), late=!l.is_checked && l.log_date<ymd(new Date());
  return `<div class="todo ${l.is_checked?'done':''}" data-id="${l.id}">
    <input type="checkbox" data-c="${l.id}" ${l.is_checked?'checked':''} aria-label="완료">
    <span class="t">${esc(l.text)}</span>
    ${f?`<span class="tag" style="background:${f.color};color:${fg(f.color)}">${esc(f.name)}</span>`:''}
    <span class="dt ${late?'late':''}">${l.log_date.slice(5).replace('-','/')}</span></div>`;
}
function renderTodo(){
  const todos=S.logs.filter(l=>l.is_checked!==null);
  const open=todos.filter(l=>!l.is_checked), done=todos.filter(l=>l.is_checked).sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||'')).slice(0,40);
  $('open').innerHTML=open.length?open.map(todoRow).join(''):'<div class="empty">할 일이 없어요. 위에서 추가해보세요.</div>';
  $('closed').innerHTML=done.length?done.map(todoRow).join(''):'<div class="empty">아직 완료한 일이 없어요.</div>';
  document.querySelectorAll('.todo').forEach(r=>r.onclick=e=>{ if(e.target.matches('input'))return; openDlg(S.logs.find(l=>l.id===r.dataset.id)); });
  document.querySelectorAll('[data-c]').forEach(c=>c.onchange=async()=>{
    const {error}=await sb.from('didi_log').update({is_checked:c.checked,done_at:c.checked?new Date().toISOString():null}).eq('id',c.dataset.c);
    if(!fail(error))loadAll();
  });
}
async function addTodo(){
  const text=$('nt').value.trim(); if(!text)return;
  const {error}=await sb.from('didi_log').insert({user_id:S.user.id,text,log_date:$('nd').value||ymd(new Date()),index_id:$('ni').value||null,is_checked:false});
  if(!fail(error)){$('nt').value='';loadAll()}
}
$('nt').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)addTodo()};

/* 캘린더 */
function renderCal(){
  const y=S.month.getFullYear(), m=S.month.getMonth(), first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), today=ymd(new Date());
  $('ml').textContent=y+'년 '+(m+1)+'월';
  let h='日月火水木金土'.split('').map((_,i)=>`<div class="wd">${'일월화수목금토'[i]}</div>`).join('')+'<div class="cell blank"></div>'.repeat(first.getDay());
  for(let d=1;d<=days;d++){
    const key=y+'-'+z(m+1)+'-'+z(d);
    const items=S.logs.filter(l=>l.log_date===key).map(l=>{const c=color(l.index_id);
      return `<div class="st ${l.is_checked?'done':''}" data-id="${l.id}" style="background:${c};color:${fg(c)}">${esc(l.text)}</div>`}).join('');
    h+=`<div class="cell ${key===today?'today':''}" data-d="${key}"><div class="dn">${d}</div>${items}</div>`;
  }
  $('cal').innerHTML=h;
  $('cal').querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=e=>{
    const st=e.target.closest('.st');
    openDlg(st?S.logs.find(l=>l.id===st.dataset.id):null, c.dataset.d);
  });
}
const mv=n=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+n,1);renderCal()};
$('mp').onclick=()=>mv(-1); $('mn').onclick=()=>mv(1); $('mt').onclick=()=>{S.month=new Date();renderCal()};

/* 팝업 */
function openDlg(log,date){
  S.edit=log||null;
  $('dtitle').textContent=log?'기록 보기':'새 기록';
  $('f-t').value=log?log.text:'';
  $('f-d').value=log?log.log_date:(date||ymd(new Date()));
  $('f-i').value=log?(log.index_id||''):'';
  $('f-m').value=log?(log.meta?.memo||''):'';
  $('f-c').checked=!!(log&&log.is_checked);
  $('f-cw').classList.toggle('hide',!log);
  $('f-del').classList.toggle('hide',!log);
  $('dlg').showModal();
  if(!log)$('f-t').focus();
}
$('f-x').onclick=()=>$('dlg').close();
$('f-ok').onclick=async()=>{
  const text=$('f-t').value.trim(); if(!text){toast('내용을 입력하세요');return}
  const base={text,log_date:$('f-d').value||ymd(new Date()),index_id:$('f-i').value&&$('f-i').value!=='__new'?$('f-i').value:null};
  let r;
  if(S.edit){
    const c=$('f-c').checked;
    r=await sb.from('didi_log').update({...base,meta:{...(S.edit.meta||{}),memo:$('f-m').value},is_checked:c,done_at:c?(S.edit.done_at||new Date().toISOString()):null}).eq('id',S.edit.id);
  }else{
    r=await sb.from('didi_log').insert({...base,user_id:S.user.id,is_checked:false,meta:{memo:$('f-m').value}});
  }
  if(!fail(r.error)){$('dlg').close();loadAll()}
};
$('f-del').onclick=async()=>{
  if(!confirm('삭제할까요?'))return;
  const {error}=await sb.from('didi_log').delete().eq('id',S.edit.id);
  if(!fail(error)){$('dlg').close();loadAll()}
};

boot();
</script>
</body>
</html>
