<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for delete icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 12px;
        }

        /* 220px 폭의 아날로그 종이 패드 디자인 */
        .paper-pad {
            width: 220px;
            background-color: #fbf9f1;
            background-image: repeating-linear-gradient(#fbf9f1, #fbf9f1 23px, #e8e3d5 24px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid #dcd6c5;
        }

        /* 커스텀 체크박스 */
        .paper-checkbox {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1.5px solid #334155;
            border-radius: 3px;
            background: white;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .paper-checkbox:checked {
            background-color: #334155;
            border-color: #1e293b;
        }

        .paper-checkbox:checked::after {
            content: '✓';
            position: absolute;
            font-size: 10px;
            color: white;
            top: -1px;
            left: 2px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4cfc4;
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased">

    <div class="flex flex-col items-center">
        <div class="paper-pad flex flex-col h-[380px]">
            
            <!-- 깔끔한 상단 헤더 -->
            <div class="px-3 py-2 border-b border-gray-300 flex justify-between items-center bg-[#f5f2e6]">
                <h1 class="text-xs font-bold text-gray-800 tracking-wider">TODO</h1>
            </div>

            <!-- 삭제 확인 모달 -->
            <div id="delete-modal" class="absolute inset-0 bg-black/30 z-40 flex items-center justify-center hidden p-3">
                <div class="bg-[#fbf9f1] border border-gray-400 rounded p-3 w-full shadow-lg text-center">
                    <p class="text-xs text-gray-800 mb-3">이 할 일을 삭제하시겠습니까?</p>
                    <div class="flex justify-center space-x-2">
                        <button id="confirm-delete-btn" class="bg-red-600 text-white px-3 py-1 rounded text-[11px] hover:bg-red-700">삭제</button>
                        <button onclick="closeDeleteModal()" class="bg-gray-300 text-gray-700 px-3 py-1 rounded text-[11px] hover:bg-gray-400">취소</button>
                    </div>
                </div>
            </div>

            <!-- 할 일 목록 영역 -->
            <div id="todo-list" class="flex-1 overflow-y-auto px-2 py-1 space-y-1.5 text-xs">
                <!-- 동적 렌더링 -->
            </div>

            <!-- 하단 입력폼 -->
            <form id="todo-form" onsubmit="addTask(event)" class="px-2 py-2 border-t border-gray-300 bg-[#f5f2e6]">
                <input type="text" id="task-input" placeholder="할 일 입력 후 엔터..." required
                    class="w-full bg-transparent text-xs text-gray-800 placeholder-gray-400 focus:outline-none border-b border-dashed border-gray-400 pb-1">
            </form>

        </div>
    </div>

    <script>
        // 수파베이스 설정 정보 입력
        const SUPABASE_URL = 'https://euunswnlwnhscnklnevh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1dW5zd25sd25oc2Nua2xuZXZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzcyMDcsImV4cCI6MjEwNzIxMzIwN30.x_V-Wb3aQWc2ZwSvb8r3Ge_24pYbJU4olClDp59pNII
';

        let supabaseClient = null;
        let tasks = [];
        let pendingDeleteId = null;

        window.onload = function() {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                fetchTasks();
            } catch (e) {
                console.error('Supabase init error:', e);
            }
        };

        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchTasks() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('todos')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;
                tasks = data || [];
                renderTasks();
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        async function addTask(e) {
            e.preventDefault();
            const inputEl = document.getElementById('task-input');
            const textContent = inputEl.value.trim();
            if (!textContent) return;

            const today = getTodayDateString();
            const newTodo = {
                text: textContent,
                is_checked: false,
                inputdate: today,
                checkdate: null
            };

            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('todos')
                        .insert([newTodo])
                        .select();

                    if (error) throw error;
                    if (data && data.length > 0) {
                        tasks.push(data[0]);
                    }
                    inputEl.value = '';
                    renderTasks();
                } catch (err) {
                    console.error('Insert error:', err);
                    alert('저장 실패: ' + err.message);
                }
            }
        }

        async function toggleTask(id) {
            const task = tasks.find(t => t.id == id);
            if (!task) return;

            const newCheck = !task.is_checked;
            const today = getTodayDateString();
            const newCheckDate = newCheck ? today : null;

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('todos')
                        .update({ 
                            is_checked: newCheck, 
                            checkdate: newCheckDate 
                        })
                        .eq('id', id);

                    if (error) throw error;
                    task.is_checked = newCheck;
                    task.checkdate = newCheckDate;
                    renderTasks();
                } catch (err) {
                    console.error('Update error:', err);
                }
            }
        }

        function promptDelete(id, event) {
            event.stopPropagation();
            pendingDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
            document.getElementById('confirm-delete-btn').onclick = function() {
                executeDelete(pendingDeleteId);
            };
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById('delete-modal').classList.add('hidden');
        }

        async function executeDelete(id) {
            closeDeleteModal();
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('todos')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                    tasks = tasks.filter(t => t.id != id);
                    renderTasks();
                } catch (err) {
                    console.error('Delete error:', err);
                }
            }
        }

        function renderTasks() {
            const listEl = document.getElementById('todo-list');
            listEl.innerHTML = '';

            if (tasks.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs italic">할 일이 없습니다.</div>`;
                return;
            }

            tasks.forEach(task => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between py-1 border-b border-gray-200/60 group ${task.is_checked ? 'opacity-60' : ''}`;
                
                const displayDate = task.is_checked ? (task.checkdate || task.inputdate) : task.inputdate;

                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-1.5 overflow-hidden pr-1 flex-1">
                        <input type="checkbox" class="paper-checkbox" ${task.is_checked ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                        <div class="flex items-center justify-between overflow-hidden flex-1 text-[11px]">
                            <span class="truncate text-gray-800 ${task.is_checked ? 'line-through text-gray-500' : ''}" title="${escapeHtml(task.text)}">
                                ${escapeHtml(task.text)}
                            </span>
                            <span class="text-[9px] text-gray-400 ml-1 whitespace-nowrap">
                                ${displayDate || ''}
                            </span>
                        </div>
                    </div>
                    <button onclick="promptDelete('${task.id}', event)" class="text-gray-300 hover:text-red-600 text-[11px] opacity-0 group-hover:opacity-100 transition px-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                listEl.appendChild(itemDiv);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
