<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1e293b;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .paper-pad {
            width: 100vw;
            height: 100vh;
            max-width: 720px;
            max-height: 480px;
            background-color: #fbf9f1;
            background-image: repeating-linear-gradient(#fbf9f1, #fbf9f1 27px, #e8e3d5 28px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-radius: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid #dcd6c5;
        }

        @media (min-width: 720px) {
            .paper-pad {
                border-radius: 8px;
            }
        }

        .paper-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #334155;
            border-radius: 3px;
            background: white;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .paper-checkbox:checked {
            background-color: #334155;
            border-color: #1e293b;
        }

        .paper-checkbox:checked::after {
            content: '✓';
            position: absolute;
            font-size: 11px;
            color: white;
            top: -1px;
            left: 2px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4cfc4;
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased">

    <div class="paper-pad flex flex-col w-full h-full">
        
        <!-- 상단 헤더 (탭 및 로그아웃) -->
        <div class="px-5 py-3 border-b border-gray-300 flex justify-between items-center bg-[#f5f2e6]">
            <div class="flex items-center space-x-4">
                <h1 class="text-sm font-bold text-gray-800 tracking-wider">DIDI</h1>
                <div id="tab-nav" class="space-x-3 text-xs hidden">
                    <button onclick="switchTab('todo')" id="btn-tab-todo" class="font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5">TODO</button>
                    <button onclick="switchTab('index')" id="btn-tab-index" class="text-gray-400 hover:text-gray-700 pb-0.5">INDEX</button>
                    <button onclick="switchTab('calendar')" id="btn-tab-calendar" class="text-gray-400 hover:text-gray-700 pb-0.5">CALENDAR</button>
                </div>
            </div>
            <div id="header-actions"></div>
        </div>

        <!-- 로그인 / 회원가입 뷰 -->
        <div id="auth-view" class="flex-1 flex flex-col justify-center px-8 py-4 text-sm">
            <div class="text-center font-bold text-gray-800 mb-4" id="auth-mode-title">로그인</div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3 max-w-sm mx-auto w-full">
                <input type="email" id="auth-email" placeholder="이메일" required
                    class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-xs text-gray-800 focus:outline-none focus:border-gray-500">
                <input type="password" id="auth-password" placeholder="비밀번호 (6자 이상)" required minlength="6"
                    class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-xs text-gray-800 focus:outline-none focus:border-gray-500">
                <button type="submit" id="auth-submit-btn" class="w-full bg-gray-800 text-white rounded py-2 font-medium hover:bg-gray-700 transition text-xs">로그인</button>
            </form>
            <div class="text-center mt-4">
                <button type="button" onclick="toggleAuthMode()" class="text-xs text-gray-500 hover:underline" id="auth-switch-text">
                    계정이 없으신가요? 회원가입
                </button>
            </div>
            <div id="auth-error" class="text-red-600 text-xs text-center mt-3 hidden"></div>
        </div>

        <!-- 메인 앱 컨테이너 (로그인 후 표시) -->
        <div id="app-main-view" class="flex-1 flex flex-col overflow-hidden hidden">
            
            <!-- 1. TODO (오늘의 기록) 탭 -->
            <div id="view-todo" class="flex-1 flex flex-col overflow-hidden">
                <div id="todo-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-2 text-xs">
                    <!-- 동적 렌더링 -->
                </div>

                <form id="todo-form" onsubmit="addTodoLog(event)" class="px-4 py-3 border-t border-gray-300 bg-[#f5f2e6] flex space-x-2 items-center">
                    <select id="log-index-select" required class="bg-white border border-gray-300 rounded px-2 py-1 text-xs text-gray-700 focus:outline-none">
                        <!-- 카테고리 옵션 동적 생성 -->
                    </select>
                    <input type="text" id="log-text-input" placeholder="오늘의 기록/할 일 입력..." required
                        class="flex-1 bg-transparent text-xs text-gray-800 placeholder-gray-400 focus:outline-none border-b border-dashed border-gray-400 pb-1">
                </form>
            </div>

            <!-- 2. INDEX (카테고리 관리) 탭 -->
            <div id="view-index" class="flex-1 flex flex-col overflow-hidden hidden">
                <div id="index-list" class="flex-1 overflow-y-auto px-4 py-3 space-y-2 text-xs">
                    <!-- 카테고리 목록 동적 생성 -->
                </div>
                <form id="index-form" onsubmit="addIndexCategory(event)" class="px-4 py-3 border-t border-gray-300 bg-[#f5f2e6]">
                    <input type="text" id="index-name-input" placeholder="새로운 카테고리 (예: 운동, 공부)..." required
                        class="w-full bg-transparent text-xs text-gray-800 placeholder-gray-400 focus:outline-none border-b border-dashed border-gray-400 pb-1">
                </form>
            </div>

            <!-- 3. CALENDAR 탭 -->
            <div id="view-calendar" class="flex-1 flex flex-col overflow-y-auto p-4 hidden">
                <div class="flex justify-between items-center mb-3">
                    <button onclick="changeMonth(-1)" class="text-xs px-2 py-1 bg-gray-200 rounded hover:bg-gray-300"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendar-title" class="text-xs font-bold text-gray-800">2026년 6월</h2>
                    <button onclick="changeMonth(1)" class="text-xs px-2 py-1 bg-gray-200 rounded hover:bg-gray-300"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-gray-600 mb-1 sticky top-0 bg-[#fbf9f1] py-1 z-10">
                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-xs">
                    <!-- 달력 날짜 및 스티커 생성 -->
                </div>
            </div>

        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://rtvvajhsnwkkrmncyfbs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6InJub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';

        let supabaseClient = null;
        let currentUser = null;
        let indexCategories = []; // 카테고리 목록
        let todayLogs = [];       // 오늘의 기록 목록
        let monthLogs = [];       // 월별 기록 목록
        let isSignUpMode = false;
        let currentCalendarDate = new Date();

        window.onload = async function() {
            try {
                if (!window.supabase) throw new Error('Supabase SDK 로드 실패');
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;

                if (session && session.user) {
                    currentUser = session.user;
                    showAppView();
                } else {
                    showAuthView();
                }

                supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (session && session.user) {
                        currentUser = session.user;
                        showAppView();
                    } else {
                        currentUser = null;
                        showAuthView();
                    }
                });
            } catch (e) {
                console.error('Supabase init error:', e);
                showAuthView();
            }
        };

        function showAuthView() {
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('app-main-view').classList.add('hidden');
            document.getElementById('tab-nav').classList.add('hidden');
            document.getElementById('header-actions').innerHTML = '';
        }

        function showAppView() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-main-view').classList.remove('hidden');
            document.getElementById('tab-nav').classList.remove('hidden');
            document.getElementById('header-actions').innerHTML = `
                <button onclick="logout()" class="text-gray-500 hover:text-red-600 text-xs" title="로그아웃">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            `;
            loadAppData();
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-mode-title').innerText = isSignUpMode ? '회원가입' : '로그인';
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? '가입하기' : '로그인';
            document.getElementById('auth-switch-text').innerText = isSignUpMode ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입';
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            try {
                if (isSignUpMode) {
                    const { error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('회원가입 완료!');
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        async function logout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
        }

        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function switchTab(tabName) {
            const todoView = document.getElementById('view-todo');
            const indexView = document.getElementById('view-index');
            const calendarView = document.getElementById('view-calendar');
            
            const btnTodo = document.getElementById('btn-tab-todo');
            const btnIndex = document.getElementById('btn-tab-index');
            const btnCalendar = document.getElementById('btn-tab-calendar');

            todoView.classList.add('hidden');
            indexView.classList.add('hidden');
            calendarView.classList.add('hidden');
            btnTodo.className = "text-gray-400 hover:text-gray-700 pb-0.5";
            btnIndex.className = "text-gray-400 hover:text-gray-700 pb-0.5";
            btnCalendar.className = "text-gray-400 hover:text-gray-700 pb-0.5";

            if (tabName === 'todo') {
                todoView.classList.remove('hidden');
                btnTodo.className = "font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5";
                loadTodayData();
            } else if (tabName === 'index') {
                indexView.classList.remove('hidden');
                btnIndex.className = "font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5";
                loadIndexData();
            } else if (tabName === 'calendar') {
                calendarView.classList.remove('hidden');
                btnCalendar.className = "font-bold text-gray-900 border-b-2 border-gray-800 pb-0.5";
                loadCalendarData();
            }
        }

        async function loadAppData() {
            await loadIndexCategoriesCache();
            loadTodayData();
        }

        async function loadIndexCategoriesCache() {
            if (!supabaseClient || !currentUser) return;
            const { data, error } = await supabaseClient
                .from('didi_index')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('id', { ascending: true });

            if (!error) {
                indexCategories = data || [];
                updateIndexSelectOptions();
            }
        }

        function updateIndexSelectOptions() {
            const selectEl = document.getElementById('log-index-select');
            selectEl.innerHTML = '';
            if (indexCategories.length === 0) {
                selectEl.innerHTML = `<option value="">카테고리 없음</option>`;
                return;
            }
            indexCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.innerText = cat.name;
                selectEl.appendChild(opt);
            });
        }

        // --- TODO (오늘의 기록) 기능 ---
        async function loadTodayData() {
            await loadIndexCategoriesCache();
            if (!supabaseClient || !currentUser) return;
            const today = getTodayDateString();

            try {
                const { data, error } = await supabaseClient
                    .from('didi_log')
                    .select('*, didi_index(name)')
                    .eq('user_id', currentUser.id)
                    .eq('log_date', today)
                    .order('id', { ascending: true });

                if (error) throw error;
                todayLogs = data || [];
                renderTodoList();
            } catch (err) {
                console.error('Load today logs error:', err);
            }
        }

        async function addTodoLog(e) {
            e.preventDefault();
            const indexId = document.getElementById('log-index-select').value;
            const textInput = document.getElementById('log-text-input');
            const textContent = textInput.value.trim();

            if (!indexId || !textContent || !currentUser) {
                alert('카테고리를 먼저 생성하거나 내용을 입력해주세요.');
                return;
            }

            const newLog = {
                user_id: currentUser.id,
                index_id: indexId,
                log_date: getTodayDateString(),
                text: textContent,
                is_checked: false
            };

            try {
                const { error } = await supabaseClient.from('didi_log').insert([newLog]);
                if (error) throw error;
                textInput.value = '';
                loadTodayData();
            } catch (err) {
                console.error('Add log error:', err);
            }
        }

        async function toggleLogCheck(logId, currentStatus) {
            try {
                const { error } = await supabaseClient
                    .from('didi_log')
                    .update({ is_checked: !currentStatus })
                    .eq('id', logId);

                if (error) throw error;
                loadTodayData();
            } catch (err) {
                console.error('Toggle log error:', err);
            }
        }

        async function deleteLog(logId) {
            try {
                const { error } = await supabaseClient
                    .from('didi_log')
                    .delete()
                    .eq('id', logId);

                if (error) throw error;
                loadTodayData();
            } catch (err) {
                console.error('Delete log error:', err);
            }
        }

        function renderTodoList() {
            const listEl = document.getElementById('todo-list');
            listEl.innerHTML = '';

            if (todayLogs.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs italic">오늘 작성된 기록이 없습니다.</div>`;
                return;
            }

            todayLogs.forEach(log => {
                const categoryName = log.didi_index ? log.didi_index.name : '기타';
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between py-1.5 border-b border-gray-200/60 group ${log.is_checked ? 'opacity-60' : ''}`;
                
                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden pr-1 flex-1 text-xs">
                        <input type="checkbox" class="paper-checkbox" ${log.is_checked ? 'checked' : ''} onchange="toggleLogCheck('${log.id}', ${log.is_checked})">
                        <span class="bg-[#f3ecd8] border border-[#d6cfbe] rounded px-1.5 py-0.5 text-[10px] text-gray-700 font-medium whitespace-nowrap">${escapeHtml(categoryName)}</span>
                        <span class="truncate text-gray-800 flex-1 ${log.is_checked ? 'line-through text-gray-500' : ''}" title="${escapeHtml(log.text)}">
                            ${escapeHtml(log.text)}
                        </span>
                    </div>
                    <button onclick="deleteLog('${log.id}')" class="text-gray-300 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100 transition px-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                listEl.appendChild(itemDiv);
            });
        }

        // --- INDEX (카테고리) 관리 기능 ---
        async function loadIndexData() {
            await loadIndexCategoriesCache();
            renderIndexList();
        }

        async function addIndexCategory(e) {
            e.preventDefault();
            const inputEl = document.getElementById('index-name-input');
            const name = inputEl.value.trim();
            if (!name || !currentUser) return;

            try {
                const { error } = await supabaseClient
                    .from('didi_index')
                    .insert([{ user_id: currentUser.id, name }]);

                if (error) throw error;
                inputEl.value = '';
                loadIndexData();
            } catch (err) {
                console.error('Add index error:', err);
            }
        }

        async function deleteIndexCategory(id) {
            if (!confirm('이 카테고리를 삭제하시겠습니까? 연결된 기록들도 함께 삭제될 수 있습니다.')) return;
            try {
                const { error } = await supabaseClient
                    .from('didi_index')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                loadIndexData();
            } catch (err) {
                console.error('Delete index error:', err);
            }
        }

        function renderIndexList() {
            const listEl = document.getElementById('index-list');
            listEl.innerHTML = '';

            if (indexCategories.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs italic">등록된 카테고리가 없습니다. 아래에서 추가해주세요.</div>`;
                return;
            }

            indexCategories.forEach(cat => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between py-2 border-b border-gray-200/60 group`;
                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-slate-700"></span>
                        <span class="font-bold text-gray-800 text-xs">${escapeHtml(cat.name)}</span>
                    </div>
                    <button onclick="deleteIndexCategory('${cat.id}')" class="text-gray-300 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100 transition px-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                listEl.appendChild(itemDiv);
            });
        }

        // --- CALENDAR 기능 ---
        async function loadCalendarData() {
            if (!supabaseClient || !currentUser) return;

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            const startDate = `${year}-${String(month + 1).padStart(2, '0')}-01`;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const endDate = `${year}-${String(month + 1).padStart(2, '0')}-${lastDay}`;

            document.getElementById('calendar-title').innerText = `${year}년 ${month + 1}월`;

            try {
                const { data, error } = await supabaseClient
                    .from('didi_log')
                    .select('*, didi_index(name)')
                    .eq('user_id', currentUser.id)
                    .gte('log_date', startDate)
                    .lte('log_date', endDate);

                if (error) throw error;
                monthLogs = data || [];
                renderCalendarGrid(year, month);
            } catch (err) {
                console.error('Load calendar error:', err);
            }
        }

        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            loadCalendarData();
        }

        function renderCalendarGrid(year, month) {
            const gridEl = document.getElementById('calendar-grid');
            gridEl.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                gridEl.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayLogs = monthLogs.filter(l => l.log_date === dateStr);

                const cellDiv = document.createElement('div');
                cellDiv.className = `border border-gray-300/60 rounded p-1 flex flex-col items-start bg-white/40 min-h-[75px] overflow-hidden`;
                
                let stickersHtml = '';
                if (dayLogs.length > 0) {
                    dayLogs.forEach(log => {
                        const catName = log.didi_index ? log.didi_index.name : '기타';
                        const opacityClass = log.is_checked ? 'opacity-90' : 'opacity-40';
                        const checkMark = log.is_checked ? '✓ ' : '';
                        stickersHtml += `<div class="w-full bg-[#f3ecd8] border border-[#d6cfbe] rounded px-1 py-0.5 text-[9px] text-gray-800 truncate mt-0.5 ${opacityClass}" title="[${catName}] ${escapeHtml(log.text)}">${checkMark}[${catName}] ${escapeHtml(log.text)}</div>`;
                    });
                }

                cellDiv.innerHTML = `
                    <span class="text-[11px] font-bold text-gray-700">${day}</span>
                    <div class="w-full mt-0.5 flex flex-col space-y-0.5">
                        ${stickersHtml}
                    </div>
                `;

                gridEl.appendChild(cellDiv);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
