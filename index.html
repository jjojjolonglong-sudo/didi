:root{--ink:#111;--yel:#FFD60A;--pink:#FF4D8D;--blue:#2D6BFF;--gray:#E4E4E4;

*{box-sizing:border-box}

html,body{margin:0;color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:16px;line-height:1.3}
body{min-width:240px;max-width:640px;margin:0 auto;padding:12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:2px solid var(--ink);border-radius:6px;padding:7px;background:#fff;min-width:0;width:100%}
input:disabled,select:disabled,textarea:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
dialog.view input:not([type=checkbox]),dialog.view select,dialog.view textarea{border-color:transparent;background:transparent;padding:3px 0;appearance:none;-webkit-appearance:none;resize:none}
dialog.view textarea{min-height:0;field-sizing:content}
dialog.view input[type=date]::-webkit-calendar-picker-indicator{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2>div{min-width:0}
.ph.t3{font-size:16px;line-height:1.1}
#busy{width:auto;min-width:0;padding:16px 24px;font-weight:700}

.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--gray);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
textarea{min-height:70px;max-height:200px;resize:vertical}
button{cursor:pointer;border:2px solid var(--ink);border-radius:6px;background:var(--yel);padding:7px 12px;font-weight:700}

.todo .t{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo.done .t{text-decoration:line-through;color:#888}

<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
if(!window.Media)window.Media={init(){},url:()=>'',img:()=>'',newId:()=>crypto.randomUUID(),folder:{supported:false,name:async()=>''},process:async()=>{throw new Error('media.js could not be loaded')},upload:async()=>{throw new Error('media.js could not be loaded')},save:async()=>{throw new Error('media.js could not be loaded')}};
Media.init({worker:MEDIA_URL,getToken:async()=>(await sb.auth.getSession()).data.session?.access_token});
/* 독서·영상 분류는 코드에 고정: 삭제 불가, 이 분류의 일기는 독서앱(bkbk)·영화앱(mvmv) 행을 연결해서 표지/포스터를 가져올 수 있어요 */
const CAT_BOOK='eed2cf8c-8db6-42ba-b67f-cb18d51af4f0',CAT_MOVIE='89253f70-a97f-4747-b304-061a942866ed',CAT_WRITE='16edcf59-2231-4be4-b94e-39f5421424b3',LOCKED=new Set([CAT_BOOK,CAT_MOVIE,CAT_WRITE]);
/* 집필 분류도 고정: 이 분류의 인덱스는 인덱스 설정 창에서 집필앱(wkwk_work)의 작품(name, cover)에 직접 연결할 수 있어요 */
const isWrite=cid=>cid===CAT_WRITE,locked=id=>LOCKED.has(id);
/* 집필·독서·영상은 분류 목록 맨 위 세 개로 고정 */
const PIN=[CAT_WRITE,CAT_BOOK,CAT_MOVIE],pinCats=a=>[...PIN.map(id=>a.find(c=>c.id===id)).filter(Boolean),...a.filter(c=>!PIN.includes(c.id))];
const $=id=>document.getElementById(id);
function stampPath(W=60,H=72,k=5,d=3,mx=6,my=8,ra=1.45,rr=.7){ // k=모서리 블록, d=톱니 깊이, mx/my=가로/세로 톱니 수, ra=톱니:홈 폭 비율, rr=모서리 둥글기
  const N=(L,m)=>{const n=(L-2*k)/((m+1)+ra*m),t=ra*n,a=[];let x=k;for(let i=0;i<=m;i++){a.push([x,x+n]);x+=n+t}return a},
    X=N(W,mx),Y=N(H,my),P=[[0,0]];
  X.forEach(([a,b])=>P.push([a,0],[a,d],[b,d],[b,0]));P.push([W,0]);
  Y.forEach(([a,b])=>P.push([W,a],[W-d,a],[W-d,b],[W,b]));P.push([W,H]);
  [...X].reverse().forEach(([a,b])=>P.push([b,H],[b,H-d],[a,H-d],[a,H]));P.push([0,H]);
  [...Y].reverse().forEach(([a,b])=>P.push([0,b],[d,b],[d,a],[0,a]));
  const R=P.flatMap((V,i)=>{const A=P[(i+P.length-1)%P.length],B=P[(i+1)%P.length],u=Q=>{const dx=Q[0]-V[0],dy=Q[1]-V[1],l=Math.hypot(dx,dy);return [V[0]+dx/l*rr,V[1]+dy/l*rr]};return [u(A),u(B)]});
  return 'polygon('+R.map(([x,y])=>x.toFixed(2)+'px '+y.toFixed(2)+'px').join(',')+')';
}
document.documentElement.style.setProperty('--stamp',stampPath());
const PALETTE=['#FFD60A','#FF4D8D','#2D6BFF','#19C37D','#FF7A1A','#8B5CF6','#00C2E0'];
const S={user:null,logs:[],trash:[],cats:[],idxs:[],month:new Date(),edit:null,img:undefined};
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>ymd(new Date());
const noon=d=>new Date(d+'T12:00:00').toISOString();
const doneDay=l=>l.done_at?ymd(new Date(l.done_at)):'';
const dd=s=>s?s.slice(5,10).replace('-','/'):'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),2400)}
function fail(e){if(e){toast('오류: '+e.message);return true}return false}
function fg(h){const n=parseInt(h.slice(1),16),l=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;return l>0.6?'#111':'#fff'}
const cat=id=>S.cats.find(c=>c.id===id), ix=id=>S.idxs.find(i=>i.id===id), find=id=>S.logs.find(l=>l.id===id);
const rep=l=>l.image_url||ix(l.index_id)?.image_url||cat(l.category_id)?.image_url||null;
const col=l=>cat(l.category_id)?.color||'#E4E4E4';
function ph(l,big){const u=Media.url(rep(l));return u?`<div class="ph" data-img="${esc(u)}"></div>`:`<div class="ph t3" style="color:${fg(col(l))}"><b>${Array.from(l.text||'').filter(c=>c.trim()).slice(0,3).map(esc).join('<br>')}</b></div>`}
function onDay(l,key,t){
  if(l.is_checked)return (doneDay(l)||l.log_date)===key;
  if(l.is_checked===null)return l.log_date===key;
  return l.log_date===key&&key>=t;
}

function renderCal(){
  const y=S.month.getFullYear(),m=S.month.getMonth(),first=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),t=today();
  document.querySelectorAll('.ml').forEach(e=>e.textContent=y+'년 '+(m+1)+'월');
  let h='일월화수목금토'.split('').map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="cell blank"></div>'.repeat(first.getDay());
  for(let d=1;d<=n;d++){
    const key=y+'-'+z(m+1)+'-'+z(d);
    const it=ord(S.logs.filter(l=>onDay(l,key,t))).map(l=>`<div class="st ${l.is_checked?'done':''}" data-id="${l.id}" style="background:${col(l)};color:${fg(col(l))}">${esc(l.text)}</div>`).join('');
    h+=`<div class="cell ${key===t?'today':''}" data-d="${key}"><div class="dn">${d}<span class="em">${stampsOn(key).map(x=>`<span data-idx="${x.id}" title="${esc(x.name)}">${esc(x.emoji)}</span>`).join('')}</span></div>${it}</div>`;
  }

function renderDay(){
  const s0=S.week,t=today(),e=new Date(s0);e.setDate(e.getDate()+6);
  document.querySelectorAll('.wl').forEach(el=>el.textContent=`${s0.getMonth()+1}/${s0.getDate()} – ${e.getMonth()+1}/${e.getDate()}`);
  let h='';
  for(let i=0;i<7;i++){

      +it.map(l=>`<div class="sw"><div class="stamp" data-id="${l.id}" style="background:${col(l)}" title="${esc(l.text)}">${ph(l)}</div></div>`).join('')
      +(em.length?`<div class="emo4" data-d="${key}" title="${esc(emAll.map(x=>x.name).join(', '))}">${em.map(x=>`<span data-idx="${x.id}" title="${esc(x.name)}">${esc(x.emoji)}</span>`).join('')}${emAll.length>4?`<span style="font-size:13px;font-weight:700;cursor:default">+${emAll.length-3}</span>`:''}</div>`:'')
      +(em.length||it.length?'':'<span class="dt">–</span>')+'</div></div>';

  const logs=a=>{if(!a.length)return '<div class="lg" style="cursor:default;color:#888">기록 없음</div>';
    return [...a].reverse().slice(0,30).map(l=>`<div class="lg" data-lid="${l.id}"><span class="t">${l.is_checked?'✅ ':''}${esc(l.text)}</span><span class="dt">${dd(l.log_date)}</span></div>`).join('')
      +(a.length>30?`<div class="lg" style="cursor:default;color:#888">… 오래된 기록 ${a.length-30}개는 생략 (캘린더·날짜별에서 볼 수 있어요)</div>`:'')};
  const node=(key,label,a)=>{const o=S.open.has(key);return `<div class="mr sub"><span class="t" data-tg="${key}">${o?'▾':'▸'} ${label} <small>(${a.length})</small></span></div>`+(o?logs(a):'')};
  const irow=i=>{const a=S.logs.filter(l=>l.index_id===i.id),o=S.open.has('i:'+i.id);
    return `<div class="mr sub ${i.finished_on?'ended':''}" data-k="didi_index" data-id="${i.id}">${th(i,'#E4E4E4')}<span class="t" data-tg="i:${i.id}">${o?'▾':'▸'} ${i.emoji?esc(i.emoji)+' ':''}${esc(i.name)} <small>(${a.length})</small>${per(i)}</span><button class="plain" data-a="edit">수정</button></div>`+(o?logs(a):'')};
  const idxs=cid=>{const a=S.idxs.filter(i=>cid?i.category_id===cid:(!i.category_id||!cat(i.category_id)));return [...a.filter(i=>!i.finished_on),...a.filter(i=>i.finished_on)]};
  let h='';
  for(const c of S.cats){const shut=S.shut.has(c.id);
    h+=`<div class="mr" data-k="didi_category" data-id="${c.id}">${th(c,c.color)}<b class="t" data-tg="c:${c.id}">${shut?'▸':'▾'} ${esc(c.name)}</b><input type="color" value="${c.color}" data-col="${c.id}" style="width:34px;height:26px;padding:1px">${btn}<button data-a="add">+인덱스</button>${locked(c.id)?'<span class="hint">🔒 고정</span>':'<button class="red" data-a="del">삭제</button>'}</div>`;
    if(!shut)h+=idxs(c.id).map(irow).join('')+node('n:'+c.id,'(인덱스 없음)',S.logs.filter(l=>l.category_id===c.id&&!ix(l.index_id)));
  }
  const oi=idxs(null),ol=S.logs.filter(l=>(!l.category_id||!cat(l.category_id))&&!ix(l.index_id));
  if(oi.length||ol.length)h+='<div class="mr"><b class="t">분류 없음</b></div>'+oi.map(irow).join('')+node('n:','(인덱스 없음)',ol);
  h+='<div style="margin-top:8px"><button id="addcat">+ 분류 추가</button></div>';
  $('more').innerHTML=h;
  $('mp-trash').innerHTML=S.trash.length?S.trash.map(l=>`<div class="mr" data-k="didi_log" data-id="${l.id}"><span class="t">${esc(l.text)}</span><span class="dt">${dd(ymd(new Date(l.discarded_at)))}</span><button class="plain" data-a="res">복원</button><button class="red" data-a="rm">삭제</button></div>`).join(''):'<div class="empty">비어 있어요.</div>';
  document.querySelector('[data-mp=trash]').textContent=`휴지통 (${S.trash.length})`;
}
$('more').addEventListener('change',async e=>{
  if(!e.target.dataset.col)return;
  const {error}=await sb.from('didi_category').update({color:e.target.value}).eq('id',e.target.dataset.col);
  if(!fail(error))loadAll();
});
$('tab-more').addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='addcat'){const n=(prompt('새 분류 이름')||'').trim();if(!n)return;
    const {error}=await sb.from('didi_category').insert({user_id:S.user.id,name:n,color:PALETTE[S.cats.length%PALETTE.length],sort_order:S.cats.length});if(!fail(error))loadAll();return}
  const lg=t.closest('[data-lid]');if(lg){const l=find(lg.dataset.lid);if(l)openDlg(l);return}
  const a=t.dataset.a,row=t.closest('.mr');
  if(!a){const tg=t.closest('[data-tg]');if(tg){const k=tg.dataset.tg,c=k[0]==='c',set=c?S.shut:S.open,id=c?k.slice(2):k;set.has(id)?set.delete(id):set.add(id);renderMore()}return}
  if(!row)return;
  const tb=row.dataset.k,id=row.dataset.id;let r;
  if(a==='img'){const f=await pick();if(!f)return;try{r=await sb.from(tb).update({image_url:await uploadImg(f,id)}).eq('id',id)}catch(err){toast(err.message);return}}
  else if(a==='ren'){const o=cat(id),n=(prompt('이름',o.name)||'').trim();if(!n)return;r=await sb.from(tb).update({name:n}).eq('id',id)}
  else if(a==='add'){const d=await newIdx(id);if(d){S.open.add('i:'+d.id);loadAll()}return}
  else if(a==='edit'){openIdx(ix(id),true);return}
  else if(a==='del'){if(locked(id)){toast('독서·영상·집필 분류는 삭제할 수 없어요');return}if(!confirm('분류를 삭제할까요?\n이 분류의 인덱스와 기록은 남고, 분류만 비워져요.'))return;r=await sb.from(tb).delete().eq('id',id)}
  else if(a==='res')r=await sb.from('didi_log').update({discarded_at:null}).eq('id',id);
  else if(a==='rm'){if(!confirm('완전히 삭제할까요?'))return;r=await sb.from('didi_log').delete().eq('id',id)}
  if(r&&!fail(r.error))loadAll();
});

/* 날짜 입력: 연도는 4자리까지만 (20261010처럼 이어서 입력 가능) */
document.querySelectorAll('input[type=date]').forEach(i=>{i.min='1000-01-01';i.max='9999-12-31'});
S.open=new Set();S.shut=new Set();

/* 정렬: 완료한 항목은 완료 시각순, 그 뒤에 미완료(입력일순) */
const byDone=(a,b)=>(a.done_at||'').localeCompare(b.done_at||'');
const ord=a=>[...a.filter(l=>l.is_checked).sort(byDone),...a.filter(l=>!l.is_checked)];

/* 매일 도장: 반복='매일 도장' + 이모지 + 시작일~종료일. 오늘까지만 찍히고, '안 한 날'은 meta.skip에 날짜로 저장해 뺍니다 */
function stampsOn(key){const t=today();return S.idxs.filter(i=>i.recur?.t==='d'&&i.emoji&&i.started_on&&key>=i.started_on&&key<=t&&(!i.finished_on||key<=i.finished_on)&&!(i.meta?.skip||[]).includes(key))}
const EMOJIS=['🏃','🚶','🧘','🏋️','🚴','🏊','📖','📚','✍️','📝','🎹','🎸','🎨','💻','🧠','💊','🥗','💧','☕','🍎','🛌','🪥','🧹','🌱','🐶','🐱','☀️','🌙','⭐','❤️','🔥','✅','💰','🎧','🎯','📅'];
$('emo-g').innerHTML=EMOJIS.map(e=>`<button class="plain" type="button">${e}</button>`).join('');
$('emo-g').onclick=e=>{if(e.target.tagName==='BUTTON')$('emo-in').value=e.target.textContent};
$('emo-p').addEventListener('emoji-click',e=>{$('emo-in').value=e.detail.unicode});
$('emo-rw').innerHTML='일월화수목금토'.split('').map((c,i)=>`<label class="dchk"><input type="checkbox" value="${i}">${c}</label>`).join('');

/* 인덱스 창: 보기(기본) / 수정 한 창에서 사진·이름·분류·이모지·반복·기간·종료·삭제 */
function emoMode(edit){$('emo').classList.toggle('view',!edit);$('emo').querySelectorAll('input,select').forEach(e=>e.disabled=!edit)}
function recUi(){const v=$('emo-r').value;$('emo-rw').classList.toggle('hide',v!=='w');$('emo-rnn').classList.toggle('hide',v!=='n');$('emo-rmo').classList.toggle('hide',v!=='m');
  $('emo-rh').textContent={d:'시작일부터 오늘까지 매일 이모지 도장이 찍혀요. (이모지 필요)',w:'이 인덱스의 로그를 체크하면 다음 요일의 로그가 자동으로 만들어져요.',n:'로그를 체크하면 N일 뒤의 로그가 자동으로 만들어져요.',m:'로그를 체크하면 다음 달 그 날짜의 로그가 자동으로 만들어져요.'}[v]||''}
function wkUi(){const on=isWrite($('emo-c').value);$('emo-wr').classList.toggle('hide',!on);const r=S.emoW===undefined?S.emoIdx?.meta?.ref:S.emoW;$('emo-wt').textContent=on&&r?'✍️ '+(r.name||''):''}
function pvUi(){const u=Media.url(S.emoImg!==undefined?S.emoImg:S.emoIdx?.image_url);$('emo-pv').innerHTML=u?`<div class="ph" data-img="${esc(u)}"></div>`:''}
function fillEmo(i){
  $('emo-n').value=i.name||'';
  $('emo-c').innerHTML='<option value="">분류 없음</option>'+S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('emo-c').value=i.category_id||'';
  $('emo-in').value=i.emoji||'';$('emo-d').value=i.started_on||'';$('emo-e').value=i.finished_on||'';
  const r=i.recur;$('emo-r').value=r?r.t:'';recUi();
  document.querySelectorAll('#emo-rw input').forEach(c=>c.checked=!!(r&&r.t==='w'&&(r.d||[]).includes(+c.value)));
  $('emo-rd').value=r&&r.t==='m'?r.d:'';$('emo-rn').value=r&&r.t==='n'?r.n:'';
  $('emo-cnt').textContent=i.id?`기록 ${S.logs.filter(l=>l.index_id===i.id).length}개`:'';
  wkUi();pvUi();skUi();
}
function showEmo(){const ok=!!customElements.get('emoji-picker');$('emo-p').classList.toggle('hide',!ok);$('emo-g').classList.toggle('hide',ok);$('emo').showModal()}
function openIdx(i,edit,date){
  if(!i)return;S.emoIdx=i;S.emoDate=date||null;S.emoRes=null;S.emoRid=i.id;S.emoImg=undefined;S.emoW=undefined;
  fillEmo(i);$('emo-t').textContent=i.name+(edit?' · 수정':'');$('emo-danger').classList.remove('hide');emoMode(!!edit);showEmo();
}
$('emo-edit').onclick=()=>{emoMode(true);$('emo-t').textContent=(S.emoIdx?.name||'')+' · 수정'};
$('emo-r').onchange=recUi;$('emo-c').onchange=wkUi;
$('emo-end').onclick=()=>{$('emo-e').value=today()};

/* 안 한 날 (매일 도장): 해당 날짜만 도장 제외 */
function skUi(){const i=S.emoIdx,on=!!(i&&i.id&&i.recur?.t==='d');$('emo-sk').classList.toggle('hide',!on);if(!on)return;
  const sk=[...(i.meta?.skip||[])].sort(),d=S.emoDate;
  $('emo-skl').innerHTML=sk.length?sk.map(x=>`<span class="sk">${x.replace(/-/g,'/')}<button type="button" class="plain" data-sk="${x}">✕</button></span>`).join(''):'<span class="hint" style="margin:0">없음</span>';
  const show=d&&d>=(i.started_on||'')&&d<=today()&&!sk.includes(d);
  $('emo-skb').classList.toggle('hide',!show);if(show)$('emo-skb').textContent=`${d.replace(/-/g,'/')} 안 함`}
async function setSkip(list){const i=S.emoIdx,meta={...(i.meta||{}),skip:list};
  const {error}=await sb.from('didi_index').update({meta}).eq('id',i.id);if(fail(error))return;i.meta=meta;skUi();loadAll()}
$('emo-skb').onclick=()=>setSkip([...(S.emoIdx.meta?.skip||[]),S.emoDate]);
$('emo-skl').onclick=e=>{const d=e.target.dataset.sk;if(d)setSkip((S.emoIdx.meta?.skip||[]).filter(x=>x!==d))};

/* 반복 로그(요일마다/N일마다/매월): 체크하면 다음 회차 로그를 만들어요 */
const isChain=i=>!!i&&['w','n','m'].includes(i.recur?.t);
const renderAll=()=>{renderTodo();renderCal();renderDay();renderMore()};
function nextOn(i,l){
  const r=i.recur,base=[l.log_date,doneDay(l)].filter(Boolean).sort().pop();if(!base)return null;
  const d=new Date(base+'T00:00:00');let nx=null;
  if(r.t==='n'){d.setDate(d.getDate()+Math.max(1,r.n||1));nx=ymd(d)}
  else if(r.t==='w'){const days=r.d||[];if(!days.length)return null;
    for(let k=1;k<=7;k++){const x=new Date(d);x.setDate(d.getDate()+k);if(days.includes(x.getDay())){nx=ymd(x);break}}}
  else{let y=d.getFullYear(),m=d.getMonth();
    for(let k=0;k<2;k++){const last=new Date(y,m+1,0).getDate(),c=ymd(new Date(y,m,Math.min(r.d||1,last)));if(c>base){nx=c;break}m++;if(m>11){m=0;y++}}}
  return nx&&!(i.finished_on&&nx>i.finished_on)?nx:null}
async function chainNext(l){
  const i=ix(l.index_id);if(!isChain(i))return;
  if(S.logs.some(x=>x.index_id===i.id&&x.is_checked===false&&x.id!==l.id))return;   // 열려 있는 회차가 있으면 만들지 않아요
  const nx=nextOn(i,l);if(!nx)return;
  const {data,error}=await sb.from('didi_log').insert({user_id:S.user.id,text:l.text,index_id:l.index_id,category_id:l.category_id,log_date:nx,is_checked:false,meta:{from:l.id}}).select().single();
  if(fail(error))return;S.logs.push(data);renderAll();toast('다음 회차를 만들었어요 ('+nx.slice(5).replace('-','/')+')')}
async function chainUndo(l){
  const {error}=await sb.from('didi_log').delete().eq('meta->>from',l.id).eq('is_checked',false);
  if(!error){S.logs=S.logs.filter(x=>!(x.meta?.from===l.id&&x.is_checked===false));renderAll()}}
$('emo-pick').onclick=async()=>{const f=await pick();if(!f)return;try{S.emoImg=await uploadImg(f,S.emoRid);pvUi();toast('사진을 올렸어요')}catch(e){toast(e.message)}};
$('emo-rm').onclick=()=>{S.emoImg=null;pvUi()};
$('emo-w').onclick=async()=>{try{
  const w=await sb.from('wkwk_work').select('id,name,cover').limit(1000);
  if(w.error)throw new Error(w.error.message);
  const items=w.data.map(x=>({hash:x.cover||'',title:x.name||'(제목 없음)',ref:{t:'wkwk_work',id:x.id}})).sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  const o=await choose(items,'작품 검색');if(!o)return;
  S.emoW={t:'wkwk_work',id:o.ref.id,name:o.title};if(o.hash){S.emoImg=o.hash;pvUi()}
  if(!$('emo-n').value.trim())$('emo-n').value=o.title;
  wkUi()}catch(e){toast(e.message)}};
$('emo-wx').onclick=()=>{S.emoW=null;wkUi()};
$('emo-x').onclick=()=>$('emo').close();
$('emo').addEventListener('close',()=>{if(S.emoRes){S.emoRes(null);S.emoRes=null}});
$('emo-ok').onclick=async()=>{
  const name=$('emo-n').value.trim();if(!name){toast('이름을 입력하세요');return}
  const em=$('emo-in').value.trim(),sd=$('emo-d').value,ed=$('emo-e').value;
  if(sd&&ed&&ed<sd){toast('종료일이 시작일보다 빨라요');return}
  let recur=null;const rt=$('emo-r').value;
  if(rt==='d'){if(!em){toast('매일 도장에는 이모지가 필요해요');return}recur={t:'d'}}
  else if(rt==='n'){const n=parseInt($('emo-rn').value);if(!(n>=1&&n<=365)){toast('간격(일)을 입력하세요');return}recur={t:'n',n}}
  else if(rt==='w'){const d=[...document.querySelectorAll('#emo-rw input:checked')].map(c=>+c.value);if(!d.length){toast('요일을 하나 이상 고르세요');return}recur={t:'w',d}}
  else if(rt==='m'){const d=parseInt($('emo-rd').value);if(!(d>=1&&d<=31)){toast('날짜(1~31)를 입력하세요');return}recur={t:'m',d}}
  const f={name,category_id:$('emo-c').value||null,emoji:em||null,started_on:sd||(em?today():null),finished_on:ed||null,recur};
  const old=S.emoIdx&&S.emoIdx.id?S.emoIdx:null,meta={...(old?.meta||{})};
  if(S.emoW!==undefined){if(S.emoW)meta.ref=S.emoW;else delete meta.ref}
  f.meta=meta;if(S.emoImg!==undefined)f.image_url=S.emoImg;
  if(old){
    const {error}=await sb.from('didi_index').update(f).eq('id',old.id);if(fail(error))return;
    if((old.category_id||null)!==f.category_id)await sb.from('didi_log').update({category_id:f.category_id}).eq('index_id',old.id);   // 기록의 분류도 함께 이동
    $('emo').close();loadAll();return}
  const {data,error}=await sb.from('didi_index').insert({...f,id:S.emoRid,user_id:S.user.id,sort_order:S.idxs.length}).select().single();
  if(fail(error))return;S.idxs.push(data);const r=S.emoRes;S.emoRes=null;$('emo').close();if(r)r(data);loadAll();
};
$('emo-del').onclick=async()=>{
  if(!confirm('이 인덱스를 삭제할까요?\n기록은 남고, 인덱스만 비워져요.'))return;
  const {error}=await sb.from('didi_index').delete().eq('id',S.emoIdx.id);if(!fail(error)){$('emo').close();loadAll()}
};

/* 날짜별: 주 단위 / 오늘·날짜 이동 */
function sun(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
S.week=sun(new Date());
document.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{S.week.setDate(S.week.getDate()+7*(+b.dataset.wk));renderDay()});
document.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{if(b.dataset.today==='m'){S.month=new Date();renderCal()}else{S.week=sun(new Date());renderDay()}});
document.querySelectorAll('.jd').forEach(i=>{
  i.onclick=()=>{try{i.showPicker()}catch(e){}};
  i.onchange=()=>{if(!i.value)return;const d=new Date(i.value+'T00:00:00');
    if(i.dataset.t==='m'){S.month=new Date(d.getFullYear(),d.getMonth(),1);renderCal()}else{S.week=sun(d);renderDay()}i.value=''};
});

document.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mp]').forEach(x=>x.classList.toggle('on',x===b));['tree','trash','app'].forEach(t=>$('mp-'+t).classList.toggle('hide',t!==b.dataset.mp))});

/* 독서앱 동기화: DB 함수 didi_sync_bkbk 호출 */
$('bksync').onclick=async()=>{
  $('bksync').disabled=true;$('bkmsg').textContent='동기화 중…';
  const {data,error}=await sb.rpc('didi_sync_bkbk');$('bksync').disabled=false;
  if(error){$('bkmsg').textContent='실패: '+error.message;return}
  $('bkmsg').textContent=data?.changed?`${data.changed}개를 반영했어요`:'바뀐 게 없어요';await loadAll();
};

/* 앱 설치 안내 + 점검 */
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;showInst()});
async function pwaCheck(){
  const out=[],ok=(t,v)=>out.push((v?'✅ ':'❌ ')+t);
  ok('HTTPS 접속',location.protocol==='https:');
  try{const r=await fetch('manifest.json');ok('manifest.json 파일',r.ok);const m=await r.json();
    for(const i of m.icons||[]){try{ok('아이콘 '+i.sizes+(i.purpose==='maskable'?' (maskable)':''),(await fetch(i.src)).ok)}catch(e){ok('아이콘 '+i.sizes,false)}}
  }catch(e){ok('manifest.json 파일',false)}
  let reg=null;try{reg=await navigator.serviceWorker.getRegistration()}catch(e){}
  ok('서비스 워커 등록',!!reg);
  return out;
}
async function showInst(){
  const ua=navigator.userAgent,sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let h=sa?'<b>설치된 앱으로 실행 중이에요.</b>':dp?'<button id="instbtn">앱 설치</button>':/iphone|ipad|ipod/i.test(ua)?'아이폰: 사파리에서 공유 버튼 → "홈 화면에 추가"':'크롬 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"';
  if(/KAKAOTALK|NAVER|FBAN|FBAV|Instagram|Line\//i.test(ua))h+='<br>⚠️ 앱 안의 브라우저예요. 크롬이나 사파리로 열어 주세요.';
  h+='<br>'+(await pwaCheck()).join('<br>');
  $('inst').innerHTML=h;
  const b=$('instbtn');if(b)b.onclick=async()=>{dp.prompt();await dp.userChoice;dp=null;showInst()};
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(showInst).catch(showInst);else showInst();
boot();
</script>
